<head>

<style>
  :root{
    --ink:#1d2b36; --paper:#fffaf0; --accent:#e74c3c; --gold:#f5b82e; --ok:#2ecc71; --blue:#2e86de;
    --font:'Baloo 2','Trebuchet MS','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0f2233;color:var(--ink);font-family:var(--font);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;   /* dvh = altezza davvero visibile sui telefoni */overflow:hidden;border-radius:6px;box-shadow:0 10px 40px #0008}
  /* sui telefoni in orizzontale la scena 3D riempie tutto lo schermo, senza bande nere */
  @media (pointer:coarse) and (orientation:landscape){ #wrap{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0} }
  canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:pointer}
  .hud{position:absolute;top:1.6%;left:1.4%;right:1.4%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px;z-index:5}
  .pill{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;
    font-weight:800;font-size:clamp(13px,2.2vw,22px);box-shadow:0 3px 0 var(--ink)}
  .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  button{font-family:var(--font);font-weight:800;cursor:pointer;color:var(--ink)}
  .hb{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;
    padding:2px 10px;font-size:clamp(12px,1.9vw,19px);box-shadow:0 3px 0 var(--ink);text-decoration:none;color:var(--ink);font-weight:800}
  .hb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .hb:disabled{opacity:.45;cursor:not-allowed}
  .hb.off{opacity:.55;position:relative}
  .hb.off::after{content:'';position:absolute;left:15%;right:15%;top:48%;height:3px;background:#e74c3c;border-radius:2px;transform:rotate(-35deg)}
  #msg{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:#1d2b36e6;color:#fff;
    padding:4px 18px;border-radius:999px;font-weight:700;font-size:clamp(12px,2vw,20px);white-space:nowrap;pointer-events:none;
    max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:4}
  .placeName{position:absolute;right:1.4%;bottom:2%;color:#ffffffcc;font-weight:700;font-size:clamp(10px,1.5vw,15px);pointer-events:none}

  /* barre della lotta */
  #tension{position:absolute;right:3.5%;top:14%;height:56%;width:3.4%;background:var(--ink);border-radius:12px;padding:4px;display:none;z-index:3}
  #tension .zones{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;
    background:linear-gradient(to top,#2ecc71 0 60%,#f1c40f 60% 85%,#e74c3c 85% 100%)}
  #tension .mark{position:absolute;left:-4px;right:-4px;height:5px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px #fff}
  #tension .lbl{position:absolute;left:115%;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center;color:#fff;font-weight:800;font-size:clamp(10px,1.6vw,16px);white-space:nowrap;margin-left:12px}
  #tension.hot .mark{animation:blink .15s infinite alternate}
  @keyframes blink{to{background:#fff}}
  #fight{position:absolute;left:50%;top:13%;transform:translateX(-50%);width:34%;text-align:center;display:none;z-index:3;pointer-events:none}
  #fight .legend{color:#ffd84a;font-weight:800;font-size:clamp(14px,2.4vw,24px);text-shadow:0 2px 0 #0008;display:none}
  #fight .legend.angry{color:#ff8a7a}
  #fight .lbl{color:#fff;font-weight:800;font-size:clamp(11px,1.7vw,16px);text-shadow:0 2px 0 #0008}
  #fight .bar{height:clamp(10px,1.8vw,18px);background:var(--ink);border-radius:10px;padding:3px;margin-top:2px}
  #fight .fill{height:100%;background:#7fd3ff;border-radius:7px;width:0}
  #power{position:absolute;left:30%;bottom:16%;width:24%;display:none;text-align:center;color:#fff;font-weight:800;font-size:clamp(11px,1.6vw,15px);text-shadow:0 2px 0 #0008;z-index:3}
  #power .bar{height:clamp(12px,2vw,20px);background:var(--ink);border-radius:10px;padding:3px;margin-top:2px}
  #power .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#2ecc71,#f1c40f 60%,#e74c3c);width:0}
  .bubble{position:absolute;transform:translate(-50%,-100%);width:clamp(30px,4.6vw,46px);height:clamp(30px,4.6vw,46px);border-radius:50%;
    background:var(--paper);border:3px solid var(--ink);display:none;align-items:center;justify-content:center;font-size:clamp(16px,2.6vw,26px);
    font-weight:800;pointer-events:none;z-index:3;animation:wob .12s infinite alternate}
  .bubble.bang{background:var(--gold)}
  @keyframes wob{to{transform:translate(-50%,-100%) scale(1.1)}}

  #overlay{position:absolute;inset:0;background:#0f223399;display:none;align-items:center;justify-content:center;padding:2%;z-index:10}
  #overlay.show{display:flex}
  .panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);
    width:min(92%,720px);max-height:94%;overflow:auto;padding:14px 18px;position:relative}
  .panel h2{margin:0 0 6px;font-size:clamp(20px,3.2vw,32px);line-height:1.1}
  .panel p{margin:4px 0;font-size:clamp(13px,1.8vw,18px);line-height:1.35}
  .close{position:absolute;top:8px;right:10px;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:12px;
    font-size:18px;width:38px;height:38px;line-height:1}
  .big{background:var(--ok);border:3px solid var(--ink);border-radius:14px;padding:6px 16px;font-size:clamp(15px,2.2vw,22px);box-shadow:0 3px 0 var(--ink)}
  .big.alt{background:#7fd3ff}
  .big:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .card{text-align:center}
  .card canvas{width:min(100%,360px);height:auto}
  .badge{display:inline-block;background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:0 10px;font-weight:800;margin:0 4px;animation:pop .5s ease-out}
  .badge.red{background:#ff7b6b}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .kg{font-size:clamp(18px,2.6vw,26px);font-weight:800}
  .fact{background:#e8f4ff;border:2px dashed var(--blue);border-radius:12px;padding:6px 10px;text-align:left}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 12px}
  .cell{border:3px solid var(--ink);border-radius:12px;padding:4px;text-align:center;background:#fff;font-size:14px;line-height:1.2}
  .cell.legend{background:#fff4cf}
  .cell canvas{width:100%;height:auto}
  .cell b{display:block;font-size:15px}
  .shop{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .item{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff}
  .item .ico{font-size:34px}
  .item .txt{flex:1;font-size:clamp(13px,1.8vw,17px);line-height:1.25}
  .item .lv{display:flex;gap:3px;margin-top:3px}
  .item .lv i{width:16px;height:10px;border:2px solid var(--ink);border-radius:3px;background:#ddd}
  .item .lv i.on{background:var(--gold)}
  .places{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
  .place{border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;text-align:center;padding-bottom:8px}
  .place .sky{height:70px}
  .place b{display:block;margin:6px 0 4px;font-size:17px}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
  .step{border:3px solid var(--ink);border-radius:14px;padding:8px;background:#fff;text-align:center;font-size:15px;line-height:1.3}
  .step .e{font-size:34px}
  #nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;font-size:20px}
</style>
</head>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="hudLeft"><div class="pill" id="coins">🪙 0</div><button class="hb" id="bTech">🎈</button></div>
    <div class="btns">
      <button class="hb" id="bAlbum">🐟 Album</button>

      <button class="hb" id="bPlaces">🗺️ Luoghi</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* =========================================================
   LENZA D'ORO 3D
   Stessi pesci, stesse regole e stesso salvataggio della versione 2D.
   ========================================================= */


const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);

/* =========================================================
   MOTORE 3D
   ========================================================= */
const wrap = document.getElementById('wrap');
const cv = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); }
catch(e){ document.getElementById('nogl').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 16/9, 0.1, 600);
const CAM_BASE = V(2.4, 2.8, 4.8), LOOK_BASE = V(0, 0.6, -12);
const camLook = LOOK_BASE.clone();
camera.position.copy(CAM_BASE); camera.lookAt(camLook);

function resize(){
  const r = wrap.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
resize(); window.addEventListener('resize', resize);

const hemi = new THREE.HemisphereLight(0xdff3ff, 0x4a6a3a, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(30, 50, 20); scene.add(sun);

// materiali riutilizzati (stile low-poly: flatShading)
const MATS = {};
function mat(color, opts={}){
  const key = color + JSON.stringify(opts);
  if (!MATS[key]) MATS[key] = new THREE.MeshStandardMaterial(Object.assign({ color, flatShading:true, roughness:.85 }, opts));
  return MATS[key];
}
function mesh(geo, m, x=0, y=0, z=0){ const o = new THREE.Mesh(geo, m); o.position.set(x,y,z); return o; }

// cielo a gradiente
function skyTexture(top, bottom){
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0,0,2,256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ---------------- ACQUA ---------------- */
const waterGeo = new THREE.PlaneGeometry(260, 260, 90, 90); waterGeo.rotateX(-Math.PI/2);
const waterMat = new THREE.MeshPhongMaterial({ color:0x3fa7b8, flatShading:true, transparent:true, opacity:.8, shininess:90, specular:0x99bbcc });
const water = new THREE.Mesh(waterGeo, waterMat); water.position.set(0, 0, -100); scene.add(water);
const waterBase = Float32Array.from(waterGeo.attributes.position.array);
let flow = 0;   // velocità della corrente (torrente)
function waveH(x, z, t){
  return Math.sin(x*.35 + t*1.3 + flow*t*1.5)*.07 + Math.cos(z*.3 + t*1.1)*.07 + Math.sin((x+z)*.8 + t*2)*.025;
}
function updateWater(t){
  const a = waterGeo.attributes.position.array;
  for (let i=0;i<a.length;i+=3){ a[i+1] = waveH(waterBase[i] + water.position.x, waterBase[i+2] + water.position.z, t); }
  waterGeo.attributes.position.needsUpdate = true;
}

/* ---------------- SCENARI ---------------- */
let env = null, envAnim = [];
const clouds = [];
function cloud(x, y, z, s){
  const g = new THREE.Group(), m = mat('#ffffff', {roughness:1});
  [[0,0,0,1],[1.2,.3,0,.8],[-1.1,.2,.2,.75],[.4,.6,-.2,.7]].forEach(([a,b,c,r]) => g.add(mesh(new THREE.IcosahedronGeometry(r*2.2, 0), m, a*2, b*2, c*2)));
  g.position.set(x,y,z); g.scale.setScalar(s); return g;
}
function pine(x, z, h){
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(.15, .2, h*.25, 5), mat('#5b3b22'), 0, h*.12, 0));
  for (let k=0;k<3;k++) g.add(mesh(new THREE.ConeGeometry(h*(.32 - k*.07), h*.42, 7), mat(k%2 ? '#2f6b45' : '#35774c'), 0, h*(.38 + k*.2), 0));
  g.position.set(x, 0, z); g.rotation.y = Math.random()*6; return g;
}
function rock(x, y, z, s, color='#8a8e94'){
  const r = mesh(new THREE.DodecahedronGeometry(1, 0), mat(color), x, y, z);
  r.scale.set(s*rand(.9,1.3), s*rand(.5,.8), s*rand(.9,1.3)); r.rotation.y = Math.random()*6; return r;
}
function mountain(x, z, r, h){
  const g = new THREE.Group();
  g.add(mesh(new THREE.ConeGeometry(r, h, 6), mat(Math.random()<.5 ? '#6a7d92' : '#7d8fa3'), 0, h/2, 0));
  g.add(mesh(new THREE.ConeGeometry(r*.32, h*.32, 6), mat('#f4f8fb'), 0, h - h*.16 + .1, 0));
  g.position.set(x, -2, z); g.rotation.y = Math.random()*6; return g;
}
function reed(x, z){
  const g = new THREE.Group(), h = rand(1.4, 2.4);
  g.add(mesh(new THREE.CylinderGeometry(.025, .035, h, 4), mat('#4f7f2e'), 0, h/2, 0));
  if (Math.random() < .5) g.add(mesh(new THREE.CapsuleGeometry(.07, .3, 2, 5), mat('#7a4a24'), 0, h - .1, 0));
  g.position.set(x, -.2, z); g.userData.ph = Math.random()*6; return g;
}

let seatY = .75;  // altezza a cui siede Tommaso

function buildEnv(pl){
  if (env){ scene.remove(env); }
  env = new THREE.Group(); envAnim = [];
  scene.background = skyTexture(pl.sky[0], pl.sky[1]);
  const fogC = new THREE.Color(pl.sky[1]);
  scene.fog = new THREE.Fog(fogC, 60, 230);
  waterMat.color.set(pl.water[0]);
  flow = pl.id === 'torrente' ? 1 : 0;

  // nuvole
  for (let i=0;i<7;i++){ const c = cloud(rand(-90, 90), rand(28, 45), rand(-160, -60), rand(.8, 1.6)); c.userData.v = rand(.6, 1.4); env.add(c); envAnim.push(o => { c.position.x += c.userData.v * o.dt; if (c.position.x > 110) c.position.x = -110; }); }

  if (pl.id === 'torrente'){
    hemi.color.set('#dff3ff'); hemi.groundColor.set('#4a6a3a'); sun.color.set('#ffffff'); sun.intensity = 1.6;
    // sole
    env.add(mesh(new THREE.SphereGeometry(6, 16, 12), new THREE.MeshBasicMaterial({color:'#fff3a8', fog:false}), 60, 70, -200));
    // rive del torrente
    const bank = mat('#6aa04a');
    [-1, 1].forEach(s => { const b = mesh(new THREE.BoxGeometry(60, 1.4, 260), bank, s*42, .2, -100); env.add(b); });
    for (let i=0;i<70;i++){ const s = Math.random() < .5 ? -1 : 1; env.add(pine(s*rand(14, 50), rand(-150, 6), rand(4, 8))); }
    for (let i=0;i<9;i++) env.add(mountain(rand(-150, 150), rand(-210, -170), rand(25, 45), rand(45, 80)));
    for (let i=0;i<10;i++) env.add(rock(rand(-11, 11), 0, rand(-60, -6), rand(.4, 1.2)));
    // masso dove siede Tommaso
    const big = mesh(new THREE.DodecahedronGeometry(1, 1), mat('#9a9fa5'), .2, -.6, .9); big.scale.set(2.4, 1.3, 2.4); env.add(big);
    env.add(rock(-1.6, .2, 1.6, .7, '#a3a8ae'));
    seatY = .7;
  }
  else if (pl.id === 'lago'){
    hemi.color.set('#ffe2b8'); hemi.groundColor.set('#4a6a3a'); sun.color.set('#ffd29a'); sun.intensity = 1.4;
    env.add(mesh(new THREE.SphereGeometry(9, 18, 14), new THREE.MeshBasicMaterial({color:'#ffb347', fog:false}), 40, 18, -210));
    // colline e rive
    for (let i=0;i<12;i++){ const h = mesh(new THREE.SphereGeometry(1, 10, 6), mat(i%2 ? '#8bbf6a' : '#6fa856'), rand(-160, 160), -3, rand(-190, -140)); h.scale.set(rand(25, 45), rand(10, 22), rand(15, 25)); env.add(h); }
    const shore = mat('#7fb05c');
    env.add(mesh(new THREE.BoxGeometry(80, 1.2, 260), shore, -58, .1, -100));
    env.add(mesh(new THREE.BoxGeometry(80, 1.2, 260), shore, 62, .1, -100));
    for (let i=0;i<40;i++){ const s = Math.random() < .5 ? -1 : 1; env.add(pine(s*rand(20, 60), rand(-140, 0), rand(4, 7))); }
    // casetta sulla riva lontana
    const house = new THREE.Group();
    house.add(mesh(new THREE.BoxGeometry(4, 3, 3.5), mat('#f2e3c6'), 0, 1.5, 0));
    const roof = mesh(new THREE.ConeGeometry(3.4, 2.2, 4), mat('#c0392b'), 0, 4.1, 0); roof.rotation.y = Math.PI/4; house.add(roof);
    house.position.set(-22, .6, -70); env.add(house);
    // canneti
    for (let i=0;i<90;i++){ const r = reed(rand(5, 14) * (i%3===0 ? -1 : 1), rand(-14, 2)); env.add(r); envAnim.push(o => { r.rotation.z = Math.sin(o.t*1.4 + r.userData.ph) * .06; }); }
    // pontile di legno
    const wood = mat('#b07a46'), dark = mat('#7a4f2c');
    env.add(mesh(new THREE.BoxGeometry(2.6, .16, 9), wood, .2, .55, 3.8));
    for (let z=-.2; z<8; z+=2.2) [-1, 1].forEach(s => env.add(mesh(new THREE.CylinderGeometry(.12, .12, 2, 6), dark, .2 + s*1.15, -.4, z)));
    seatY = .72;
  }
  else {
    hemi.color.set('#e6f6ff'); hemi.groundColor.set('#335577'); sun.color.set('#ffffff'); sun.intensity = 1.7;
    env.add(mesh(new THREE.SphereGeometry(6, 16, 12), new THREE.MeshBasicMaterial({color:'#fff6c0', fog:false}), -70, 80, -210));
    // isola lontana
    const isl = mesh(new THREE.SphereGeometry(1, 10, 6), mat('#8fb8c9'), 50, -4, -170); isl.scale.set(45, 18, 20); env.add(isl);
    // faro su uno scoglio
    const lh = new THREE.Group();
    lh.add(rock(0, 0, 0, 4, '#6d7b84'));
    for (let k=0;k<5;k++) lh.add(mesh(new THREE.CylinderGeometry(1.1 - k*.08, 1.2 - k*.08, 2, 10), mat(k%2 ? '#e74c3c' : '#f4f4f4'), 0, 2 + k*2, 0));
    lh.add(mesh(new THREE.CylinderGeometry(.9, .9, 1.2, 8), new THREE.MeshBasicMaterial({color:'#ffe680'}), 0, 12.6, 0));
    lh.add(mesh(new THREE.ConeGeometry(1.2, 1.4, 8), mat('#e74c3c'), 0, 13.9, 0));
    lh.position.set(-34, 0, -75); env.add(lh);
    // barca a vela che dondola
    const boat = new THREE.Group();

function rebuildRod(ten){

  if (S === 'charge'){ tipT = HAND.clone().add(V(.15 + aim*.9, 2.7, .9)); mid = HAND.clone().lerp(tipT, .5); }

    const dx = target.x - HAND.x, dz = target.z - HAND.z, dl = Math.hypot(dx, dz) || 1;
    const reach = 2.2 + bend*.004;
    tipT = HAND.clone().add(V(dx/dl*reach + .3, 2.3 - bend*.016, dz/dl*reach));
    mid = HAND.clone().lerp(tipT, .5).add(V(0, .25 + bend*.004, -.1));

  tipT.x += Math.sin(now*70) * vib; tipT.y += Math.cos(now*57) * vib;

function buildFish3D(f){
  const g = new THREE.Group();
  const h = f.tall ? .44 : f.long ? .24 : .32;
  const cBody = new THREE.Color(f.col[0]), cBelly = new THREE.Color(f.col[1]), cAcc = new THREE.Color(f.col[2]);
  // corpo: sfera allungata con colori per vertice (pancia chiara, disegni)
  const geo = new THREE.SphereGeometry(.5, 24, 14);
  const pos = geo.attributes.position, cols = [];
  const tmp = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const y = pos.getY(i), z = pos.getZ(i);
    tmp.copy(cBody).lerp(cBelly, clamp((-y + .02) / .18, 0, 1));
    if (f.pat === 'stripes' && y > -.15 && z > -.38 && z < .3 && Math.sin((z + .5) * 30) > .45) tmp.copy(cAcc);
    if (f.pat === 'band' && z > -.36 && z < -.26 && y > -.1) tmp.copy(cAcc);
    if (f.pat === 'waves' && y > .06 && Math.sin(z*34 + y*16) > .4) tmp.copy(cAcc);
    if (f.pat === 'scales' && y > -.1 && (i % 3 === 0)) tmp.multiplyScalar(.82);
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const bodyMat = new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:.45, metalness:.15 });
  if (f.legend){ bodyMat.emissive = new THREE.Color('#ffcf3a'); bodyMat.emissiveIntensity = .22; }
  const body = new THREE.Mesh(geo, bodyMat); body.scale.set(h*.5, h, 1); g.add(body);
  const rx = .5*h*.5, ry = .5*h;
  const finMat = new THREE.MeshStandardMaterial({ color:cBody.clone().multiplyScalar(.8), flatShading:true, side:THREE.DoubleSide, roughness:.6 });
  // coda (si muove)
  const tail = new THREE.Group(); tail.position.z = .42; g.add(tail);
  tail.add(tri([0,0,0, 0,h*.62,.36, 0,0,.22,  0,0,0, 0,0,.22, 0,-h*.62,.36], finMat));
  // pinne
  const df = f.sail ? 1.5 : .55;
  g.add(tri([0,ry*.85,-.2, 0,ry*(1 + df),-.02, 0,ry*.85,.16], finMat));
  g.add(tri([0,-ry*.8,-.05, 0,-ry*1.4,.1, 0,-ry*.85,.12], finMat));
  [-1, 1].forEach(s => g.add(tri([s*rx*.9,-ry*.2,-.2, s*rx*1.8,-ry*.6,-.05, s*rx*.9,-ry*.3,-.06], finMat)));
  // macchie
  if (f.pat === 'spots'){
    for (let i=0;i<14;i++){
      const z = -.3 + ((i*37) % 60) / 60 * .58, y = ry * (-.3 + ((i*53) % 40) / 40 * .95);
      const k = 1 - (z/.5)**2 - (y/ry)**2; if (k <= .05) continue;
      const x = rx * Math.sqrt(k);
      const m = new THREE.MeshBasicMaterial({ color: (f.dots2 && i%3 === 1) ? f.dots2 : f.col[2] });
      [-1, 1].forEach(s => { const sp = mesh(new THREE.SphereGeometry(.022 + h*.02, 6, 4), m, s*x*.98, y, z); sp.scale.x = .35; g.add(sp); });
    }
  }
  if (f.pat === 'finlets') for (let i=0;i<6;i++){ [1, -1].forEach(s => { const c = mesh(new THREE.ConeGeometry(.02, .06, 4), mat(f.col[2]), 0, s*ry*(.75 - i*.06), .12 + i*.05); if (s < 0) c.rotation.z = Math.PI; g.add(c); }); }
  // occhi
  [-1, 1].forEach(s => {
    g.add(mesh(new THREE.SphereGeometry(h*.13, 8, 6), mat('#ffffff'), s*rx*.82, ry*.15, -.33));
    g.add(mesh(new THREE.SphereGeometry(h*.07, 6, 4), mat('#111111'), s*(rx*.82 + h*.07), ry*.15, -.35));
  });
  // barbigli
  if (f.barbels) [-1, 1].forEach(s => { const b = mesh(new THREE.CylinderGeometry(.006, .004, f.legend ? .5 : .18, 3), mat(f.col[2]), s*rx*.4, -ry*.35 - (f.legend ? .2 : .07), -.48); b.rotation.x = .5; b.rotation.z = s*.3; g.add(b); });
  g.userData = { tail, body };
  g.rotation.order = 'YXZ';   // prima beccheggio, poi direzione
  // ricordo i materiali originali per poterli "spegnere" sott'acqua
  g.traverse(o => { if (o.isMesh) o.userData.orig = o.material; });
  return g;
}

let S = 'idle', T = 0, now = 0;

function setState(s){ S = s; T = 0; }

function press(){

  }
  else if (S === 'bite') startReel(startDist);
}
function release(){ holding = false; if (S === 'charge') doCast(); }
/* Mira: trascinando a destra/sinistra mentre carichi il lancio (o con le frecce ← →) */
let aim = 0, aimStartX = 0, aimStart = 0, aimKeys = 0;
const AIM_MAX = .6;   // circa 35 gradi per lato
function aimDir(){ return aim * AIM_MAX; }
function landingPoint(pw){ const d = 5 + pw*15, a = aimDir(); return V(.4 + Math.sin(a)*d, 0, -Math.cos(a)*d); }
cv.addEventListener('pointerdown', e => { e.preventDefault(); aimStartX = e.clientX; aimStart = aim; press(); });
window.addEventListener('pointermove', e => {
  if (!holding || S !== 'charge') return;
  aim = clamp(aimStart + (e.clientX - aimStartX) / (wrap.getBoundingClientRect().width * .3), -1, 1);
});
window.addEventListener('keydown', e => { if (e.code === 'ArrowLeft') aimKeys = -1; if (e.code === 'ArrowRight') aimKeys = 1; });
window.addEventListener('keyup', e => { if ((e.code === 'ArrowLeft' && aimKeys < 0) || (e.code === 'ArrowRight' && aimKeys > 0)) aimKeys = 0; });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); if (!e.repeat) press(); } });
window.addEventListener('keyup', e => { if (e.code === 'Space'){ e.preventDefault(); release(); } });

function doCast(){
  castFrom.copy(tip);
  castTo.copy(landingPoint(power)); castTo.x += rand(-.4, .4);   // un pizzico di imprecisione
  SFX.cast(); setState('cast');
}

function fishLen(){ return fish.legend ? 3.4 : .8 + Math.min(1, kg/fish.max) * 1.0; }   // dimensioni esagerate apposta: si vedono meglio

function prepareFish(){
  if (fish3d){ scene.remove(fish3d); }
  fish3d = buildFish3D(fish); fish3d.visible = false; scene.add(fish3d);
}

function startReel(d = 100){
  SFX.bite();
  const b = BEHAVIOR[fish.beh];
  R = { dist:d, ten:30, mode:'calm', modeT: (b.firstRun || fish.legend) ? .5 : rand(1.2,2.2), dur:1, next:null, forced: b.firstRun ? 'run' : null,
        slack:0, over:0, sway:0, depth:0, angry:false, drum:0,
        sz: fish.legend ? 1 : Math.min(1, kg/fish.max),   // quanto è grosso (0..1)
        lat:0, latT:0, head:0, base:V(), prev:null };
  R.maxDist = 100 + 50*R.sz;   // i pesci grossi possono scappare oltre il punto del lancio
  if (R.sz > .6){ R.forced = 'run'; R.modeT = .5; }   // e partono subito con una bella fuga
  if (fish.legend){ shake = .25; say(`⭐ È ${fish.name.toUpperCase()}, IL PESCE LEGGENDARIO! ⭐`, 3); }
  setState('reel');
}
function nextMove(){
  if (R.forced){ const m = R.forced; R.forced = null; return m; }
  const entries = Object.entries(BEHAVIOR[fish.beh].moves);
  let r = Math.random() * entries.reduce((a,[,w]) => a + w, 0);
  for (const [m, w] of entries){ r -= w; if (r <= 0) return m; }
  return entries[0][0];
}
function enterMove(m){
  const b = BEHAVIOR[fish.beh];
  R.mode = m;
  R.modeT = R.dur = m==='run' ? rand(.8,1.3)*b.len*(.85 + .35*R.sz) : m==='dive' ? rand(1.4,2.2)*b.len : m==='charge' ? rand(.9,1.4) : 1.0;
  if (m==='run'){ splash(bob, 14); ripple(bob, .4); SFX.splash(); }
  if (m==='jump'){ splash(bob, 24, true); ripple(bob, .5); SFX.splash(); shake = fish.legend ? .3 : .15; }
  if (m==='charge') SFX.whoosh();
  // dove va il pesce: le fughe lo portano lontano di lato, quando ti viene incontro torna verso il centro
  const side = Math.random() < .5 ? -1 : 1;
  if (m==='run') R.latT = R.lat + side * rand(2, 3 + 4*R.sz);
  else if (m==='charge') R.latT = R.lat * .3;
  else R.latT = R.lat + rand(-1, 1);
  R.latT = clamp(R.latT, -latLimit(), latLimit());
}
function latLimit(){ return place().id === 'torrente' ? 8 : place().id === 'lago' ? 11 : 18; }
function lerpAngle(a, b, t){ let d = (b - a) % (Math.PI*2); if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2; return a + d*t; }
function lose(text, snapped){
  if (fish && fish.legend){ save.pity[place().id] = 15; persist(); text = '⭐ Il leggendario è scappato... ma tornerà! 💪 ' + text; }
  if (snapped) SFX.snap(); else SFX.lose();
  if (snapped) shake = .2;
  say(text, 2.6); ripple(bob, .3);
  setState('lost');
}
function catchFish(){
  if (fish.legend){ SFX.legend(); shake = .35; splash(V(0, 2.5, -2), 60, true, true); } else SFX.win();
  splash(bob, 30, true);
  setState('caught');
  showCard(fish, kg);
}
function jumpPos(){
  const p = 1 - R.modeT / R.dur, H = fish.legend ? 4 : 2.6;
  // salta di lato, così lo vediamo di profilo
  return { p, pos: V(bob.x - 1.2 + p*2.6, Math.sin(p*Math.PI) * H - .2, bob.z - p*.4), pitch: (.5 - p) * 1.6 };
}

function update(dt){
  now += dt; T += dt;
  shake = Math.max(0, shake - dt*.8);

  if (S === 'charge'){ const p = (T * 0.9) % 2; power = p < 1 ? p : 2 - p; }
  else if (S === 'cast'){
    const p = clamp(T / 0.95, 0, 1);
    bob.lerpVectors(castFrom, castTo, p); bob.y += Math.sin(p*Math.PI) * 5 * (1 - p*.3);
    if (p >= 1){
      SFX.splash(); splash(castTo, 16); ripple(castTo);
      bob.copy(castTo);
      fish = pickFishFor(power); kg = rollWeightFor(fish, power); omen = false; prepareFish();
      tech = save.tech; startDist = 100;
      if (tech === 'spinning'){
        spinT = rand(1.2, 4) * (1 - baitQ()*.12); spinU = 1;   // secondi di recupero prima dell'attacco
        setState('spin');
      } else {
        waitT = rand(2, 5) * TECH_WAIT[tech] * (1 - baitQ()*0.13);
        nibT = rand(.6, 1.5); nibble = 0;
        if (fish.legend) waitT += 2.5;
        setState('wait');
      }
    }
  }
  else if (S === 'wait'){
    if (flow) bob.x -= dt * .08;
    waitT -= dt; nibT -= dt; nibble = Math.max(0, nibble - dt);
    if (nibT <= 0 && waitT > 0.6){
      nibble = .25; nibT = rand(.7, 1.8);
      if (tech === 'fondo') SFX.tink();
      else if (tech === 'mosca'){ SFX.rise(); ripple(V(bob.x + rand(-.8, .8), 0, bob.z + rand(-.8, .8)), .2); }   // un pesce sale a guardare
      else { SFX.nibble(); ripple(bob, .15); }
    }
    if (tech === 'fondo') bob.y = -1.6;                                   // il piombo sta sul fondo
    else bob.y = waveH(bob.x, bob.z, now) - (nibble > 0 && tech === 'galleggiante' ? .1 : 0);
    if (fish.legend && !omen && T > 1){ omen = true; SFX.omen(); shake = .12; say('😮 Un\'ombra ENORME passa sotto la tua esca...', 3.5); }
    if (waitT <= 0){
      biteT = TECH_BITE[tech] + baitQ()*0.08;
      if (tech === 'fondo') SFX.bell(); else if (tech === 'mosca') SFX.splash(); else SFX.bite();
      if (tech !== 'fondo'){ splash(bob, fish.legend ? 30 : 10, fish.legend); ripple(bob, .3); }
      if (fish.legend) shake = .3;
      setState('bite');
    }
  }
  else if (S === 'spin'){
    // spinning: tenendo premuto l'esca nuota verso di te, i predatori la inseguono
    const len = Math.max(1, castTo.distanceTo(END));
    if (holding){ spinU -= (3.2 + save.reel*.4) * dt / len; spinT -= dt; }
    else spinT -= dt*.3;   // da ferma attira molto meno
    bob.lerpVectors(END, castTo, spinU);
    bob.y = holding ? -.25 : Math.max(-1.2, bob.y - dt*.6);
    if (fish.legend && !omen && T > .8){ omen = true; SFX.omen(); shake = .12; say('😮 Un\'ombra ENORME insegue la tua esca...', 3.5); }
    if (spinT <= 0){
      startDist = clamp(spinU*100, 8, 100);
      splash(bob, fish.legend ? 30 : 14, fish.legend); ripple(bob, .4); SFX.splash();
      if (fish.legend) shake = .3;
      if (holding){ say('💥 Ferrata! Ha attaccato l\'esca!', 1.6); startReel(startDist); }
      else { biteT = TECH_BITE.spinning + baitQ()*.08; setState('bite'); }
    } else if (spinU <= .06){ say('Nessun attacco questa volta... rilancia! 🥄', 2.2); setState('idle'); }
  }
  else if (S === 'bite'){
    if (tech === 'fondo'){ bob.y = -1.6; if (Math.floor(T*6) !== Math.floor((T-dt)*6)) SFX.tink(); }
    else bob.y = -.25 + Math.sin(now*30) * (fish.legend ? .08 : .03);
    if (T > biteT) lose('Troppo tardi! Ha mangiato l\'esca ed è scappato 😅');
  }
  else if (S === 'reel'){
    const str = fish.str, b = BEHAVIOR[fish.beh];
    R.modeT -= dt;
    if (R.modeT <= 0){
      if (R.mode === 'calm'){ R.next = nextMove(); R.mode = 'warn'; R.modeT = R.dur = fish.legend ? .4 : .5; SFX.alert(); ripple(bob, .3); }
      else if (R.mode === 'warn') enterMove(R.next);
      else {
        if (R.mode === 'jump'){ const j = jumpPos(); splash(j.pos.setY(0), 26, true); ripple(j.pos, .5); SFX.splash(); shake = Math.max(shake, fish.legend ? .3 : .12); }
        R.mode = 'calm';
        R.latT = clamp(R.lat + rand(-1.5, 1.5), -latLimit(), latLimit());   // a riposo gironzola un po'
        R.modeT = R.dur = rand(b.rest[0], b.rest[1]) * (1 - Math.min(str, 8)*0.03) * (R.angry ? .75 : 1);
      }
    }
    if (fish.legend && !R.angry && R.dist < 50){ R.angry = true; shake = .3; SFX.omen(); say('😡 Si è arrabbiato! Tieni duro, ' + HERO + '!', 2.5); }
    if (fish.legend){ R.drum -= dt; if (R.drum <= 0){ SFX.drum(); R.drum = R.angry ? .42 : .7; } }

    const rodK = save.rod * 6;
    const reelSpeed = (20 + save.reel*4) * Math.max(.6, 1.2 - str*0.07) * (1.1 - 0.3*Math.min(1, kg/fish.max));
    const P = Math.min(str, 7);
    const M = {
      calm:   { target: 22 + str*4,   k:2.2, hold:-reelSpeed * (R.dist > 100 ? 1.5 : 1), free: .6 },   // dopo una lunga fuga è stanco: si recupera più in fretta
      warn:   { target: 26 + str*4,   k:2.2, hold:-reelSpeed*.5,  free: .6 },
      run:    { target: 80 + str*8,   k:4.5, hold: P*.6*(.6 + 1.1*R.sz), free: P*1.4*(.6 + 1.1*R.sz) },
      dive:   { target: 45 + str*4.5, k:2.5, hold: 0,             free: P*.5 },
      jump:   { target: 90 + str*6,   k:5.0, hold: P*.3,          free: 0 },
      charge: { target: 12,           k:3.0, hold:-reelSpeed*1.2, free:-str*.6 },
    }[R.mode];
    if (holding){
      R.ten += (M.target - rodK - R.ten) * M.k * dt + (Math.random()-.5) * 30 * dt;
      R.dist += M.hold * dt;
      reelTick -= dt; if (reelTick <= 0){ SFX.click(); reelTick = .07; }
    } else {
      R.ten += (0 - R.ten) * (R.mode==='charge' ? 4 : 2.5) * dt;
      R.dist += M.free * dt;
    }
    R.ten = clamp(R.ten, 0, 110);
    R.dist = Math.min(R.dist, R.maxDist);
    R.sway += dt * (R.mode==='run' || R.mode==='charge' ? 9 : R.mode==='warn' ? 14 : 3);
    R.depth += ((R.mode==='dive' ? 1 : 0) - R.depth) * dt * 3;

    if (R.ten >= 100){ R.over += dt; warnTick -= dt; if (warnTick<=0){ SFX.warn(); warnTick=.12; } }
    else R.over = Math.max(0, R.over - dt);
    if (R.ten > 92) shake = Math.max(shake, .06);
    if (R.ten < 8) R.slack += dt * (R.mode==='charge' && !holding ? 2.2 : 1); else R.slack = Math.max(0, R.slack - dt*2);

    const wob = R.mode==='run' || R.mode==='charge' ? .6 : R.mode==='warn' ? .35 : .2;
    const latSpeed = R.mode==='run' ? 2.5 + 2*R.sz : R.mode==='charge' ? 2 : .8;
    R.lat += clamp(R.latT - R.lat, -latSpeed*dt, latSpeed*dt);
    R.base.lerpVectors(END, castTo, R.dist/100);
    R.base.x = clamp(R.base.x + R.lat * Math.min(1, R.dist/25), -latLimit() - 1, latLimit() + 1);
    // il pesce si gira nella direzione in cui si muove
    if (R.prev && dt > 0){
      const vx = (R.base.x - R.prev.x)/dt, vz = (R.base.z - R.prev.z)/dt;
      if (Math.hypot(vx, vz) > .3) R.head = lerpAngle(R.head, Math.atan2(-vx, -vz), dt*5);
    }
    R.prev = R.base.clone();
    bob.copy(R.base);
    bob.x += Math.sin(R.sway) * wob;
    bob.y = waveH(bob.x, bob.z, now) - .05 - R.depth*.25;
    if (Math.random() < dt*3) ripple(bob, .2);

    if (R.over > 0.3){
      const why = R.mode==='jump' ? 'Hai tirato mentre saltava!' : R.mode==='run' ? 'Hai tirato mentre scappava!' : R.mode==='dive' ? 'Sul fondo tirava troppo forte!' : 'Troppa tensione!';
      lose(`💥 Lenza spezzata! ${why}`, true);
    }
    else if (R.slack > 3.5) lose(R.mode==='charge' ? '🐟 Ti è venuto incontro e il filo era molle: si è liberato!' : '🐟 Lenza troppo molle: il pesce si è liberato!');
    else if (R.dist <= 0) catchFish();
  }
  else if (S === 'lost'){ if (T > 1.6) setState('idle'); }
}

/* ---------------- AGGIORNAMENTO DELLA SCENA ---------------- */
function updateScene(dt){
  updateWater(now);
  envAnim.forEach(f => f({ t: now, dt }));
  updateFx(dt);

  // Tommaso: gambe che dondolano, testa che segue il galleggiante, salto di gioia
  KID.legs.forEach((l, i) => l.rotation.x = Math.sin(now*2 + i*Math.PI) * .25);
  const follow = (S === 'idle' || S === 'charge') ? landingPoint(.6) : bob;
  const bodyYaw = clamp(Math.atan2(-follow.x, -follow.z), -.75, .75) * .7;
  kid.rotation.y = lerp(kid.rotation.y, bodyYaw, dt*3);
  kid.rotation.x = lerp(kid.rotation.x, S === 'reel' ? R.ten * .0016 : 0, dt*4);   // si piega all'indietro quando tira
  kid.updateMatrixWorld(); HAND.copy(HAND_LOCAL).applyMatrix4(kid.matrixWorld);
  const lookAt = (S === 'idle' || S === 'charge') ? landingPoint(.6) : bob;
  KID.head.rotation.y = lerp(KID.head.rotation.y, clamp(Math.atan2(-lookAt.x, -lookAt.z) - kid.rotation.y, -.6, .6), dt*4);
  KID.head.rotation.x = S === 'reel' ? -.15 : 0;
  kid.position.y = seatY - .75 + (S === 'caught' ? Math.abs(Math.sin(now*8)) * .15 : 0);
  KID.arms[0].rotation.x = .55 + (S === 'reel' && holding ? Math.sin(now*25) * .15 : 0);

  const ten = S === 'reel' ? R.ten : S === 'bite' ? (tech === 'fondo' ? 45 : 30) : (S === 'wait' && tech === 'fondo') ? 10 : (S === 'spin' && holding) ? 14 : 0;
  rebuildRod(ten);
  crank.parent.rotation.x = S === 'reel' && holding ? now*20 : 0;

  // galleggiante e filo
  let lineEnd = null, sag = .6;
  const tackleTech = (S === 'idle' || S === 'charge' || S === 'cast') ? save.tech : tech;
  const tackle = TACKLE[tackleTech];
  Object.values(TACKLE).forEach(o => o.visible = false);
  const topY = tackleTech === 'galleggiante' ? .3 : .12;   // dove si attacca il filo
  if (S === 'idle' || S === 'charge' || S === 'lost'){
    bob.copy(tip).add(V(Math.sin(now*2)*.05, S === 'lost' ? -.6 : S === 'charge' ? -.45 : -1.1, 0));
    tackle.visible = S !== 'lost' && S !== 'charge';
    lineEnd = bob.clone().add(V(0, topY, 0)); sag = 0;
  } else {
    tackle.visible = !(tackleTech === 'mosca' && S === 'bite');   // la mosca se l'è presa il pesce
    lineEnd = bob.clone().add(V(0, topY, 0));
    sag = S === 'reel' ? (1 - R.ten/100) * 1.4 : S === 'cast' ? .1 : tech === 'fondo' ? .05 : S === 'spin' ? .3 : .7;
  }
  tackle.position.copy(bob); tackle.rotation.z = Math.sin(now*3)*.1;
  if (tackleTech === 'spinning') tackle.rotation.y = now * 14;   // il cucchiaino gira

  // pesce
  if (fish3d){
    fish3d.visible = false;
    if (S === 'spin' && !fish.legend && spinT < 1.6){
      // un predatore insegue l'esca prima di attaccare
      const away = castTo.clone().sub(END).setY(0).normalize();
      fish3d.visible = true; setSil(fish3d, true); fish3d.scale.setScalar(fishLen() * 1.2);
      fish3d.position.copy(bob).addScaledVector(away, spinT*1.5 + fishLen()*.6); fish3d.position.y = -.25;
      fish3d.rotation.set(0, Math.atan2(away.x, away.z), 0);
      fish3d.userData.tail.rotation.y = Math.sin(now*18) * .5;
    }
    else if ((S === 'wait' || S === 'spin') && fish.legend && omen){
      fish3d.visible = true; setSil(fish3d, true, true);
      const a = now*.6; fish3d.scale.setScalar(4);
      fish3d.position.set(bob.x + Math.sin(a)*4, -1.8, bob.z + Math.cos(a)*2.5);
      fish3d.rotation.set(0, Math.atan2(-4*Math.cos(a), 2.5*Math.sin(a)), 0);   // la testa segue la direzione del giro
    }
    else if (S === 'wait' && waitT < 1.6){
      fish3d.visible = true; setSil(fish3d, true);
      fish3d.scale.setScalar(fishLen());
      fish3d.position.set(bob.x + waitT*2.2, tech === 'fondo' ? -1.5 : -.6, bob.z - waitT*.6);
      fish3d.rotation.set(0, 1.83, 0);   // nuota verso il galleggiante
    }
    else if (S === 'bite'){
      fish3d.visible = true; setSil(fish3d, true, fish.legend); fish3d.scale.setScalar(fishLen());
      fish3d.position.set(bob.x, -.6, bob.z - .3); fish3d.rotation.set(0, Math.sin(now*20)*.3, 0);
    }
    else if (S === 'reel'){
      fish3d.visible = true; fish3d.scale.setScalar(fishLen());
      if (R.mode === 'jump'){
        const j = jumpPos(); setSil(fish3d, false);
        fish3d.scale.setScalar(fishLen() * (fish.legend ? 1.3 : 2));   // fuori dall'acqua lo mostriamo bello grande
        fish3d.position.copy(j.pos); fish3d.rotation.set(j.pitch, -Math.PI/2 + Math.sin(now*12)*.12, 0);
        lineEnd = fish3d.localToWorld(V(0, 0, -.5)); sag = 0;
      } else {
        setSil(fish3d, true, fish.legend);
        const shakeY = R.mode === 'warn' ? Math.sin(now*28) * .6 : Math.sin(R.sway) * .3;
        const h = R.head + shakeY, L = fishLen();
        // la bocca è vicino al galleggiante, il corpo dietro nella direzione in cui nuota
        fish3d.position.set(bob.x + Math.sin(h)*L*.45, -.3 - L*.12 - R.depth*1.6, bob.z + Math.cos(h)*L*.45);
        fish3d.rotation.set(R.mode === 'dive' ? -.5 : 0, h, 0);
      }
      fish3d.userData.tail.rotation.y = Math.sin(now * (R.mode === 'calm' ? 8 : 18)) * .5;
    }
  }
  rebuildLine(lineEnd, sag);
  if (S === 'reel'){ const a = clamp((R.ten - 60) / 40, 0, 1); lineMat.color.setRGB(1, 1 - a*.75, 1 - a*.75); }
  else lineMat.color.setRGB(1, 1, 1);

  // telecamera: segue la lotta e trema
  const fightCam = S === 'wait' || S === 'bite' || S === 'reel' || S === 'spin';
  let lookWant = fightCam ? V(bob.x*.7, .2, Math.min(-6, bob.z*.85)) : LOOK_BASE.clone().add(V(aim*4, 0, 0));
  if (S === 'reel' && R.mode === 'jump') lookWant = V(bob.x*.9, 1.5, bob.z);
  camLook.lerp(lookWant, dt*2);
  // durante la lotta la telecamera si avvicina e si sposta verso il pesce
  const camWant = CAM_BASE.clone();
  if (S === 'reel') camWant.x += clamp(bob.x, -10, 10) * .15;
  if (S === 'reel' && fish.legend) camWant.add(V(.6, .6, .9));
  camera.position.lerp(camWant, dt*2);
  const s = shake;
  camera.position.x += rand(-s, s); camera.position.y += rand(-s, s);
  camera.lookAt(camLook);
  const fovWant = S === 'reel' ? (R.mode === 'jump' ? 46 : 52) : 55;
  if (Math.abs(camera.fov - fovWant) > .05){ camera.fov = lerp(camera.fov, fovWant, dt*2.5); camera.updateProjectionMatrix(); }

  // atmosfera da boss
  const boss = fish && fish.legend && (S === 'reel' || S === 'bite' || (S === 'wait' && omen));
  const fogNear = boss ? 25 : 60, fogFar = boss ? 140 : 230;
  scene.fog.near = lerp(scene.fog.near, fogNear, dt*2); scene.fog.far = lerp(scene.fog.far, fogFar, dt*2);
  const dim = boss ? (R && R.angry && S === 'reel' ? .55 : .7) : 1;
  hemi.intensity = lerp(hemi.intensity, 1.1*dim, dt*2);
  sun.intensity = lerp(sun.intensity, (place().id === 'lago' ? 1.4 : 1.65)*dim, dt*2);
}

/* ---------------- HUD ---------------- */
const msgEl = document.getElementById('msg');
const tensionEl = document.getElementById('tension'), markEl = tensionEl.querySelector('.mark');
const fightEl = document.getElementById('fight'), fightFill = fightEl.querySelector('.fill'), fightLbl = fightEl.querySelector('.lbl'), fightLeg = fightEl.querySelector('.legend');
const powerEl = document.getElementById('power'), powerFill = powerEl.querySelector('.fill');
const warnEl = document.getElementById('warnIcon'), bangEl = document.getElementById('bang');
function toScreen(v){ const p = v.clone().project(camera), r = wrap.getBoundingClientRect(); return { x:(p.x + 1)/2 * r.width, y:(1 - p.y)/2 * r.height }; }
let lastMsg = '';
function hintText(){
  if (now < tmpMsg.until) return tmpMsg.t;
  const key = matchMedia('(pointer:fine)').matches ? 'Tieni premuto (o SPAZIO)' : 'Tieni premuto';
  switch (S){
    case 'idle': return `🎣 ${key} per caricare il lancio, poi lascia!`;
    case 'charge': return matchMedia('(pointer:fine)').matches ? '↔️ Muovi il mouse (o ← →) per mirare, poi lascia!' : '↔️ Trascina a destra o sinistra per mirare, poi lascia!';
    case 'cast': return 'Vola!';
    case 'wait':
      if (tech === 'fondo') return '👀 Guarda la punta della canna: quando trema forte e suona il campanello, clicca!';
      if (tech === 'mosca') return '👀 Occhio alla mosca: quando un pesce la prende, clicca SUBITO!';
      return '👀 Aspetta... quando il galleggiante va SOTTO, clicca!';
    case 'spin': return holding ? '🥄 Recupera... i predatori inseguono l\'esca!' : `${key} per far nuotare l'esca verso di te`;
    case 'bite':
      if (tech === 'fondo') return '🔔 Driiin! ABBOCCA! CLICCA!';
      if (tech === 'mosca') return '💦 L\'ha presa! CLICCA SUBITO!';
      if (tech === 'spinning') return '💥 Attacco! CLICCA SUBITO!';
      return '❗ ABBOCCA! CLICCA SUBITO!';
    case 'reel':
      if (R.ten >= 85) return '🔥 TROPPO TESA! MOLLA!';
      if (R.mode==='warn') return '👀 Attento! Guarda l\'icona: sta per fare una mossa...';
      if (R.mode==='run') return '⚡ Scappa! Molla un attimo!';
      if (R.mode==='jump') return '🐬 Salta fuori dall\'acqua! Molla la presa!';
      if (R.mode==='charge') return holding ? '↩️ Ti viene incontro: recupera, recupera!' : '↩️ Ti viene incontro! TIENI PREMUTO e recupera!';
      if (R.mode==='dive') return '⬇️ Va sul fondo: tieni premuto, con calma';
      if (R.slack > 1.2) return '😴 Lenza molle: tieni premuto e recupera!';
      return holding ? '🌀 Recupera, recupera...' : `${key} per recuperare il filo`;
    default: return '';
  }
}

  powerEl.style.display = S === 'charge' ? 'block' : 'none';
  powerFill.style.width = (power*100) + '%';

    fightLbl.textContent = { calm:'🐟 in arrivo...', warn:'👀 attento...', run:'⚡ SCAPPA!', jump:'🐬 SALTA!', charge:'↩️ TI VIENE INCONTRO!', dive:'⬇️ VA SUL FONDO' }[R.mode];
    fightLeg.style.display = fish.legend ? 'block' : 'none';
    fightLeg.textContent = `⭐ ${fish.name.toUpperCase()} ⭐${R.angry ? ' 😡' : ''}`;

  } else warnEl.style.display = 'none';
  if (S === 'bite'){
    const p = toScreen(V(0, 2.6, 0));
    bangEl.style.display = 'flex'; bangEl.style.left = p.x + 'px'; bangEl.style.top = p.y + 'px';
  } else bangEl.style.display = 'none';
  hudTick(S);
}

/* ---------------- LOOP ---------------- */
buildEnv(place());
let last = performance.now();
/* Bersaglio sull'acqua: scia di puntini + anello dove cadrà il galleggiante */
const aimDots = [], aimDotMat = new THREE.MeshBasicMaterial({ color:0xffd84a, transparent:true, opacity:.9, depthWrite:false });
for (let i=0;i<14;i++){ const d = new THREE.Mesh(new THREE.CircleGeometry(.12, 10), aimDotMat); d.rotation.x = -Math.PI/2; scene.add(d); aimDots.push(d); }
const aimRing = new THREE.Mesh(new THREE.RingGeometry(.9, 1.2, 28), new THREE.MeshBasicMaterial({ color:0xffd84a, transparent:true, opacity:.95, depthWrite:false }));
aimRing.rotation.x = -Math.PI/2; scene.add(aimRing);
function updateAim(dt){
  if ((S === 'idle' || S === 'charge') && aimKeys && !UI.open) aim = clamp(aim + aimKeys*dt*1.3, -1, 1);
  const show = S === 'charge' || S === 'idle';
  aimDotMat.opacity = S === 'charge' ? .9 : .35;
  aimRing.material.opacity = S === 'charge' ? .95 : .35;
  const pw = S === 'charge' ? power : .5;
  const end = landingPoint(pw), start = V(.4, 0, -1.6);
  aimDots.forEach((d, i) => {
    const t = (i + 1) / (aimDots.length + 1);
    d.visible = show; d.position.lerpVectors(start, end, t); d.position.y = waveH(d.position.x, d.position.z, now) + .04;
  });
  aimRing.visible = show; aimRing.position.set(end.x, waveH(end.x, end.z, now) + .05, end.z);
  aimRing.scale.setScalar((1 + Math.sin(now*6)*.08) * (.7 + pw*.6));
}

function step(dt){
  updateAim(dt);
  if (!UI.open || S === 'caught') update(UI.open ? 0 : dt);
  updateScene(dt);
  renderer.render(scene, camera);
  updateHud();
}
let frozen = false;   // solo per i test
function frame(t){
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (!frozen) step(dt);
  requestAnimationFrame(frame);
}
initUI({
  title: "Lenza d'Oro 3D",
  state: () => S,
  toIdle: () => setState('idle'),
  say: (t, d) => say(t, d),
  onOpen: () => { holding = false; },
  onPlaceChange: () => buildEnv(place()),
});
requestAnimationFrame(frame);

// aiuto per i test dal browser
window.__game = { get state(){ return S; }, get spinT(){ return spinT; }, get R(){ return R; }, get fish(){ return fish; }, get kg(){ return kg; }, save,
  press, release, force(id){ forceFish = id; }, freeze(v){ frozen = v; }, setAim(v){ aim = v; }, get castTo(){ return castTo; }, tick(n=1){ for (let i=0;i<n;i++) step(1/60); } };
</script>
