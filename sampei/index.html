<style>
  :root{
    --ink:#1d2b36; --paper:#fffaf0; --accent:#e74c3c; --gold:#f5b82e; --ok:#2ecc71; --blue:#2e86de;
    --font:'Baloo 2','Trebuchet MS','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0f2233;color:var(--ink);font-family:var(--font);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;   /* dvh = altezza davvero visibile sui telefoni */overflow:hidden;border-radius:6px;box-shadow:0 10px 40px #0008}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:pointer}
  .hud{position:absolute;top:1.6%;left:1.4%;right:1.4%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
  .pill{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;
    font-weight:800;font-size:clamp(13px,2.2vw,22px);box-shadow:0 3px 0 var(--ink)}
  .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  button{font-family:var(--font);font-weight:800;cursor:pointer;color:var(--ink)}
  .hb{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;
    padding:2px 10px;font-size:clamp(12px,1.9vw,19px);box-shadow:0 3px 0 var(--ink)}
  .hb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .hb:disabled{opacity:.45;cursor:not-allowed}
  .hb.off{opacity:.55;position:relative}
  .hb.off::after{content:'';position:absolute;left:15%;right:15%;top:48%;height:3px;background:#e74c3c;border-radius:2px;transform:rotate(-35deg)}
  #msg{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:#1d2b36e6;color:#fff;
    padding:4px 18px;border-radius:999px;font-weight:700;font-size:clamp(12px,2vw,20px);white-space:nowrap;pointer-events:none;
    max-width:94%;overflow:hidden;text-overflow:ellipsis}
  #overlay{position:absolute;inset:0;background:#0f223399;display:none;align-items:center;justify-content:center;padding:2%}
  #overlay.show{display:flex}
  .panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);
    width:min(92%,720px);max-height:94%;overflow:auto;padding:14px 18px;position:relative}
  .panel h2{margin:0 0 6px;font-size:clamp(20px,3.2vw,32px);line-height:1.1}
  .panel p{margin:4px 0;font-size:clamp(13px,1.8vw,18px);line-height:1.35}
  .close{position:absolute;top:8px;right:10px;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:12px;
    font-size:18px;width:38px;height:38px;line-height:1}
  .big{background:var(--ok);border:3px solid var(--ink);border-radius:14px;padding:6px 16px;font-size:clamp(15px,2.2vw,22px);box-shadow:0 3px 0 var(--ink)}
  .big.alt{background:#7fd3ff}
  .big:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .card{text-align:center}
  .card canvas{width:min(100%,360px);height:auto}
  .badge{display:inline-block;background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:0 10px;font-weight:800;margin:0 4px;
    animation:pop .5s ease-out}
  .badge.red{background:#ff7b6b}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .kg{font-size:clamp(18px,2.6vw,26px);font-weight:800}
  .fact{background:#e8f4ff;border:2px dashed var(--blue);border-radius:12px;padding:6px 10px;text-align:left}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 12px}
  .cell{border:3px solid var(--ink);border-radius:12px;padding:4px;text-align:center;background:#fff;font-size:14px;line-height:1.2}
  .cell.legend{background:#fff4cf}
  .cell canvas{width:100%;height:auto}
  .cell b{display:block;font-size:15px}
  .shop{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .item{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff}
  .item .ico{font-size:34px}
  .item .txt{flex:1;font-size:clamp(13px,1.8vw,17px);line-height:1.25}
  .item .lv{display:flex;gap:3px;margin-top:3px}
  .item .lv i{width:16px;height:10px;border:2px solid var(--ink);border-radius:3px;background:#ddd}
  .item .lv i.on{background:var(--gold)}
  .places{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
  .place{border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;text-align:center;padding-bottom:8px}
  .place .sky{height:70px}
  .place b{display:block;margin:6px 0 4px;font-size:17px}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
  .step{border:3px solid var(--ink);border-radius:14px;padding:8px;background:#fff;text-align:center;font-size:15px;line-height:1.3}
  .step .e{font-size:34px}
</style>

<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="hudLeft"><div class="pill" id="coins">🪙 0</div><button class="hb" id="bTech">🎈</button></div>
    <div class="btns">
      <button class="hb" id="bAlbum">🐟 Album</button>
      <button class="hb" id="bShop">🛒 Negozio</button>
      <button class="hb" id="bPlaces">🗺️ Luoghi</button>
      <a class="hb" href="3d.html" style="text-decoration:none;color:var(--ink);font-weight:800">3D</a>
      <button class="hb" id="bMusic" title="Musica">🎵</button>
      <button class="hb" id="bSound" title="Effetti sonori">🔊</button>
      <button class="hb" id="bFull" title="Schermo intero">⛶</button>
      <button class="hb" id="bReset" title="Ricomincia da zero">🔄</button>
    </div>
  </div>
  <div id="msg"></div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
</div>

<script src="gioco-comune.js"></script>
<script>
'use strict';
/* =========================================================
   LENZA D'ORO — prototipo di gioco di pesca
   ========================================================= */

const W = 960, H = 540, WATER = 322;

/* ---------------- CANVAS ---------------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit(){ const d = Math.min(window.devicePixelRatio||1, 2); cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); }
fit(); window.addEventListener('resize', fit);


/* ---------------- STATO DI GIOCO ---------------- */
let S = 'idle', T = 0, now = 0;      // stato corrente e tempo trascorso nello stato
let holding = false;
let power = 0, castX = 0, castFrom = {x:0,y:0};
let bob = {x:0, y:0, under:0};
let waitT = 0, nibT = 0, nibble = 0, biteT = 0;
let fish = null, kg = 0;
let R = null;                         // stato del recupero
let tip = {x:0,y:0};
let particles = [], ripples = [], clouds = [], birds = [];
let tmpMsg = {t:'', until:0};
let reelTick = 0, warnTick = 0;
let shake = 0, omen = false;
let tech = 'galleggiante', spinT = 0, startDist = 100;   // tecnica del lancio in corso

for (let i=0;i<5;i++) clouds.push({x:rand(0,W), y:rand(30,140), s:rand(.6,1.3), v:rand(6,14)});
for (let i=0;i<3;i++) birds.push({x:rand(0,W), y:rand(60,160), v:rand(20,40), p:rand(0,6)});

function setState(s){ S = s; T = 0; }
function say(t, d=2.2){ tmpMsg = {t, until: now + d}; }

function seat(){ // punto dove siede il personaggio (dipende dal luogo)
  const id = place().id;
  if (id==='torrente') return {x:150, y:292};
  if (id==='lago') return {x:160, y:300};
  return {x:165, y:290};
}

/* ---------------- INPUT ---------------- */
function press(){
  audio();
  if (UI.open) return;
  holding = true;
  if (S==='idle'){ setState('charge'); }
  else if (S==='wait'){
    if (nibble > 0) say('Era solo un assaggio! Aspetta che il galleggiante vada SOTTO 👀');
    else say('Shh... aspetta che abbocchi!');
    waitT += 1.2;
  }
  else if (S==='bite'){ startReel(startDist); }
}
function release(){
  holding = false;
  if (S==='charge'){ doCast(); }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); if (!e.repeat) press(); } });
window.addEventListener('keyup', e => { if (e.code==='Space'){ e.preventDefault(); release(); } });

/* ---------------- LOGICA ---------------- */
function doCast(){
  castX = 300 + power * 600;
  castFrom = {x: tip.x, y: tip.y};
  SFX.cast();
  setState('cast');
}

function startReel(d = 100){
  SFX.bite();
  const b = BEHAVIOR[fish.beh];
  const quickStart = b.firstRun || fish.legend;
  R = { dist:d, ten:30, mode:'calm', modeT: quickStart ? .5 : rand(1.2,2.2), dur:1, next:null, forced: b.firstRun ? 'run' : null,
        slack:0, over:0, sway:0, depth:0, angry:false, drum:0 };
  if (fish.legend){ shake = 8; say(`⭐ È ${fish.name.toUpperCase()}, IL PESCE LEGGENDARIO! ⭐`, 3); }
  setState('reel');
}

function nextMove(){
  if (R.forced){ const m = R.forced; R.forced = null; return m; }
  const entries = Object.entries(BEHAVIOR[fish.beh].moves);
  let r = Math.random() * entries.reduce((a,[,w]) => a + w, 0);
  for (const [m, w] of entries){ r -= w; if (r <= 0) return m; }
  return entries[0][0];
}
function splashAt(x, n, big){
  for (let i=0;i<n;i++) particles.push({x, y:WATER, vx:rand(-120,120)*(big?1.6:1), vy:rand(-280,-80)*(big?1.3:1), life:1, c:'#e9f8ff', r:rand(2,5)});
  ripples.push({x, y:WATER, r:6, a:1});
}
function enterMove(m){
  const b = BEHAVIOR[fish.beh];
  R.mode = m;
  R.modeT = R.dur = m==='run' ? rand(.8,1.3)*b.len : m==='dive' ? rand(1.4,2.2)*b.len : m==='charge' ? rand(.9,1.4) : 1.0;
  if (m==='run'){ splashAt(bob.x, 12); SFX.splash(); }
  if (m==='jump'){ splashAt(bob.x, 18, true); SFX.splash(); shake = fish.legend ? 8 : 4; }
  if (m==='charge'){ SFX.whoosh(); }
  if (m==='dive'){ for (let i=0;i<10;i++) particles.push({x:bob.x+rand(-10,10), y:WATER, vx:rand(-20,20), vy:rand(-90,-30), life:.6, c:'#ffffffaa', r:rand(1,3)}); }
}

function lose(text, snapped){
  if (fish && fish.legend){ save.pity[place().id] = 15; persist(); text = '⭐ Il leggendario è scappato... ma tornerà! 💪 ' + text; }
  if (snapped) SFX.snap(); else SFX.lose();
  shake = snapped ? 6 : 0;
  say(text, 2.6);
  ripples.push({x:bob.x, y:WATER, r:4, a:1});
  setState('lost');
}

function catchFish(){
  if (fish.legend){ SFX.legend(); shake = 10; } else SFX.win();
  for (let i=0;i<30;i++) particles.push({x:bob.x, y:WATER, vx:rand(-160,160), vy:rand(-320,-120), life:1, c:'#bfe9ff', r:rand(2,5)});
  setState('caught');
  showCard(fish, kg);
}

function update(dt){
  now += dt; T += dt;
  const st = seat();

  // tip della canna: si piega con la tensione
  const bend = S==='reel' ? R.ten * 0.8 : S==='bite' ? (tech==='fondo' ? 45 : 30) : (S==='wait' && tech==='fondo' ? 10 : S==='spin' && holding ? 14 : 0);
  if (S==='charge'){ tip = {x: st.x + 70, y: st.y - 175}; }
  else tip = {x: st.x + 150 - bend*0.4, y: st.y - 150 + bend};
  // la canna trema quando è molto tesa o quando il pesce strattona
  let vib = 0;
  if (S==='reel') vib = Math.max(0, (R.ten - 60) / 40) * 6 + (holding && (R.mode==='run' || R.mode==='jump') ? 2 : 0) + (R.mode==='warn' ? 1.5 : 0);
  if (S==='bite') vib = fish.legend ? 5 : tech==='fondo' ? 6 : 2.5;
  if (S==='wait' && tech==='fondo' && nibble > 0) vib = 2.5;   // a fondo l'assaggio si vede sulla punta della canna
  tip.x += Math.sin(now*70) * vib; tip.y += Math.cos(now*57) * vib;
  shake = Math.max(0, shake - dt*14);

  if (S==='charge'){
    const p = (T * 0.9) % 2; power = p < 1 ? p : 2 - p;     // barra che va avanti e indietro
  }
  else if (S==='cast'){
    const p = clamp(T / 0.85, 0, 1);
    bob.x = lerp(castFrom.x, castX, p);
    bob.y = lerp(castFrom.y, WATER, p) - Math.sin(p*Math.PI) * 130;
    if (p >= 1){
      SFX.splash();
      for (let i=0;i<14;i++) particles.push({x:castX, y:WATER, vx:rand(-80,80), vy:rand(-200,-60), life:1, c:'#d6f3ff', r:rand(2,4)});
      ripples.push({x:castX, y:WATER, r:4, a:1});
      bob.x = castX; bob.y = WATER; bob.under = 0;
      fish = pickFishFor(power); kg = rollWeightFor(fish, power); omen = false;
      tech = save.tech; startDist = 100;
      if (tech === 'spinning'){
        spinT = rand(1.2, 4) * (1 - baitQ()*.12);   // secondi di recupero prima dell'attacco
        setState('spin');
      } else {
        waitT = rand(2, 5) * TECH_WAIT[tech] * (1 - baitQ()*0.13);
        nibT = rand(.6, 1.5); nibble = 0;
        if (fish.legend) waitT += 2.5;
        setState('wait');
      }
    }
  }
  else if (S==='wait'){
    if (place().id==='torrente') bob.x -= dt * 4;   // la corrente trascina un po'
    waitT -= dt; nibT -= dt; nibble = Math.max(0, nibble - dt);
    if (nibT <= 0 && waitT > 0.6){
      nibble = .25; nibT = rand(.7, 1.8);
      if (tech === 'fondo') SFX.tink();
      else if (tech === 'mosca'){ SFX.rise(); ripples.push({x:bob.x + rand(-30, 30), y:WATER, r:3, a:.8}); }   // un pesce sale a guardare
      else { SFX.nibble(); ripples.push({x:bob.x, y:WATER, r:3, a:.7}); }
    }
    if (tech === 'fondo') bob.y = WATER + 110;                       // il piombo sta sul fondo
    else if (tech === 'mosca') bob.y = WATER - 1 + Math.sin(now*2)*1;
    else bob.y = WATER + Math.sin(now*3)*1.5 + (nibble>0 ? 5 : 0);
    if (fish.legend && !omen && T > 1){ omen = true; SFX.omen(); shake = 3; say('😮 Un\'ombra ENORME passa sotto la tua esca...', 3.5); }
    if (waitT <= 0){
      biteT = TECH_BITE[tech] + baitQ()*0.08;
      if (tech === 'fondo') SFX.bell(); else if (tech === 'mosca') SFX.splash(); else SFX.bite();
      const n = fish.legend ? 30 : 10;
      for (let i=0;i<n;i++) particles.push({x:bob.x, y:WATER, vx:rand(-90,90)*(fish.legend?2:1), vy:rand(-180,-60)*(fish.legend?1.6:1), life:1, c:'#d6f3ff', r:rand(2,4)});
      if (fish.legend) shake = 7;
      setState('bite');
    }
  }
  else if (S==='spin'){
    // spinning: tenendo premuto l'esca nuota verso di te, i predatori la inseguono
    const endX = seat().x + 70;
    if (holding){ bob.x -= (70 + save.reel*10) * dt; bob.y = lerp(bob.y, WATER + 14, dt*4); spinT -= dt; }
    else { bob.y = Math.min(WATER + 45, bob.y + 18*dt); spinT -= dt*.3; }   // da ferma attira molto meno
    if (fish.legend && !omen && T > .8){ omen = true; SFX.omen(); shake = 3; say('😮 Un\'ombra ENORME insegue la tua esca...', 3.5); }
    if (spinT <= 0){
      startDist = clamp((bob.x - endX) / (castX - endX) * 100, 8, 100);
      splashAt(bob.x, fish.legend ? 30 : 14, fish.legend); SFX.splash();
      if (fish.legend) shake = 7;
      if (holding){ say('💥 Ferrata! Ha attaccato l\'esca!', 1.6); startReel(startDist); }
      else { biteT = TECH_BITE.spinning + baitQ()*.08; setState('bite'); }
    } else if (bob.x <= endX + 12){ say('Nessun attacco questa volta... rilancia! 🥄', 2.2); setState('idle'); }
  }
  else if (S==='bite'){
    if (tech === 'fondo'){ bob.y = WATER + 110; if (Math.floor(T*6) !== Math.floor((T-dt)*6)) SFX.tink(); }
    else bob.y = WATER + 14 + Math.sin(now*30)*(fish.legend ? 5 : 2);
    if (T > biteT){ lose('Troppo tardi! Ha mangiato l\'esca ed è scappato 😅'); }
  }
  else if (S==='reel'){
    const str = fish.str, b = BEHAVIOR[fish.beh];

    // --- sequenza delle mosse: calmo → avviso → mossa → calmo ...
    R.modeT -= dt;
    if (R.modeT <= 0){
      if (R.mode === 'calm'){
        R.next = nextMove(); R.mode = 'warn'; R.modeT = R.dur = fish.legend ? .4 : .5;
        SFX.alert(); ripples.push({x:bob.x, y:WATER, r:4, a:.9});
      } else if (R.mode === 'warn'){
        enterMove(R.next);
      } else {
        if (R.mode === 'jump'){ splashAt(bob.x + 60, 22, true); SFX.splash(); shake = Math.max(shake, fish.legend ? 7 : 3); }
        R.mode = 'calm';
        R.modeT = R.dur = rand(b.rest[0], b.rest[1]) * (1 - Math.min(str, 8)*0.03) * (R.angry ? .75 : 1);
      }
    }
    // il leggendario si arrabbia a metà strada
    if (fish.legend && !R.angry && R.dist < 50){ R.angry = true; shake = 7; SFX.omen(); say('😡 Si è arrabbiato! Tieni duro, ' + HERO + '!', 2.5); }
    if (fish.legend){ R.drum -= dt; if (R.drum <= 0){ SFX.drum(); R.drum = R.angry ? .42 : .7; } }

    // --- fisica del filo: ogni mossa ha la sua tensione "obiettivo" quando tieni premuto
    const rodK = save.rod * 6;
    const reelSpeed = (20 + save.reel*4) * Math.max(.6, 1.2 - str*0.07) * (1.1 - 0.3*Math.min(1, kg/fish.max));   // i pesci forti e grossi si recuperano più piano
    const P = Math.min(str, 7);   // quanto filo può strappare il pesce (limitato, così anche i giganti si possono prendere)
    const M = {
      calm:   { target: 22 + str*4,   k:2.2, hold:-reelSpeed,          free: .6 },
      warn:   { target: 26 + str*4,   k:2.2, hold:-reelSpeed*.5,       free: .6 },
      run:    { target: 80 + str*8,   k:4.5, hold: P*.6,               free: P*1.4 },
      dive:   { target: 45 + str*4.5, k:2.5, hold: 0,                  free: P*.5 },
      jump:   { target: 90 + str*6,   k:5.0, hold: P*.3,               free: 0 },
      charge: { target: 12,           k:3.0, hold:-reelSpeed*1.2,      free:-str*.6 },
    }[R.mode];
    if (holding){
      R.ten += (M.target - rodK - R.ten) * M.k * dt + (Math.random()-.5) * 30 * dt;
      R.dist += M.hold * dt;
      reelTick -= dt; if (reelTick <= 0){ SFX.click(); reelTick = .07; }
    } else {
      R.ten += (0 - R.ten) * (R.mode==='charge' ? 4 : 2.5) * dt;
      R.dist += M.free * dt;
    }
    R.ten = clamp(R.ten, 0, 110);
    R.dist = Math.min(R.dist, 100);
    R.sway += dt * (R.mode==='run' || R.mode==='charge' ? 9 : R.mode==='warn' ? 14 : 3);
    R.depth += ((R.mode==='dive' ? 70 : 0) - R.depth) * dt * 3;

    if (R.ten >= 100){ R.over += dt; warnTick -= dt; if (warnTick<=0){ SFX.warn(); warnTick=.12; } }
    else R.over = Math.max(0, R.over - dt);
    if (R.ten > 92) shake = Math.max(shake, 2.5);
    if (R.ten < 8) R.slack += dt * (R.mode==='charge' && !holding ? 2.2 : 1); else R.slack = Math.max(0, R.slack - dt*2);

    const endX = seat().x + 70;
    const wob = R.mode==='run' || R.mode==='charge' ? 14 : R.mode==='warn' ? 8 : 5;
    bob.x = endX + (castX - endX) * (R.dist/100) + Math.sin(R.sway)*wob;
    bob.y = WATER + 6 + Math.sin(R.sway*1.3)*3 + R.depth*.12;

    if (R.over > 0.3){
      const why = R.mode==='jump' ? 'Hai tirato mentre saltava!' : R.mode==='run' ? 'Hai tirato mentre scappava!' : R.mode==='dive' ? 'Sul fondo tirava troppo forte!' : 'Troppa tensione!';
      lose(`💥 Lenza spezzata! ${why}`, true);
    }
    else if (R.slack > 3.5) lose(R.mode==='charge' ? '🐟 Ti è venuto incontro e il filo era molle: si è liberato!' : '🐟 Lenza troppo molle: il pesce si è liberato!');
    else if (R.dist <= 0) catchFish();
  }
  else if (S==='lost'){
    if (T > 1.6) setState('idle');
  }

  // effetti
  particles.forEach(p => { p.vy += 600*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*1.4; });
  particles = particles.filter(p => p.life > 0 && p.y < WATER + 8);
  ripples.forEach(r => { r.r += 40*dt; r.a -= dt*0.9; });
  ripples = ripples.filter(r => r.a > 0);
  if (S==='reel' && Math.random() < dt*3) ripples.push({x:bob.x, y:WATER, r:3, a:.6});
  clouds.forEach(c => { c.x += c.v*dt; if (c.x > W+120) c.x = -120; });
  birds.forEach(b => { b.x += b.v*dt; b.p += dt*8; if (b.x > W+30){ b.x = -30; b.y = rand(50,170); } });
}

/* ---------------- DISEGNO ---------------- */
function draw(){
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawScene();
  ctx.restore();
}
function drawScene(){
  const pl = place(), st = seat();
  // cielo
  let g = ctx.createLinearGradient(0,0,0,WATER);
  g.addColorStop(0, pl.sky[0]); g.addColorStop(1, pl.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,WATER);
  // sole
  ctx.fillStyle = pl.id==='lago' ? '#ffb347' : '#fff3a8';
  ctx.beginPath(); ctx.arc(pl.id==='lago'?760:820, pl.id==='lago'?200:80, pl.id==='lago'?48:36, 0, Math.PI*2); ctx.fill();
  // nuvole
  ctx.fillStyle = '#ffffffd9';
  clouds.forEach(c => { ctx.beginPath(); ctx.ellipse(c.x, c.y, 50*c.s, 16*c.s, 0, 0, Math.PI*2); ctx.ellipse(c.x+28*c.s, c.y-10*c.s, 30*c.s, 16*c.s, 0, 0, Math.PI*2); ctx.ellipse(c.x-26*c.s, c.y-6*c.s, 24*c.s, 12*c.s, 0, 0, Math.PI*2); ctx.fill(); });

  // sfondo per luogo
  if (pl.id==='torrente') drawMountains();
  else if (pl.id==='lago') drawHills();
  else drawSea();

  // uccelli
  ctx.strokeStyle = '#2b3a46'; ctx.lineWidth = 2;
  birds.forEach(b => { const f = Math.sin(b.p)*5; ctx.beginPath(); ctx.moveTo(b.x-9, b.y-f); ctx.quadraticCurveTo(b.x-4, b.y-4, b.x, b.y); ctx.quadraticCurveTo(b.x+4, b.y-4, b.x+9, b.y-f); ctx.stroke(); });

  // acqua
  g = ctx.createLinearGradient(0,WATER,0,H);
  g.addColorStop(0, pl.water[0]); g.addColorStop(1, pl.water[1]);
  ctx.fillStyle = g; ctx.fillRect(0, WATER, W, H-WATER);
  drawWaves(pl);

  // ombra del leggendario che gira intorno al galleggiante
  if ((S==='wait' || S==='spin') && fish && fish.legend && omen){
    const sx = bob.x + Math.sin(now*.8)*170, dirS = Math.cos(now*.8) > 0 ? 1 : -1;
    drawFish(ctx, sx, WATER + 70, 190, fish, {dir:dirS, wig:now*3, sil:true, alpha:.3});
  }
  // spinning: un predatore insegue l'esca prima di attaccare
  if (S==='spin' && fish && spinT < 1.6){
    const a = (1.6 - spinT) / 1.6, rx = fish.legend ? 90 : 22 + Math.min(1, kg/fish.max) * 22;
    ctx.globalAlpha = a * .4; ctx.fillStyle = '#0a1a22';
    ctx.beginPath(); ctx.ellipse(bob.x + 18 + spinT*60, bob.y + 6, rx, rx*.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // ombra del pesce che si avvicina (più grande se il pesce è grosso)
  if (S==='wait' && fish && !fish.legend && waitT < 1.6){
    const a = (1.6 - waitT) / 1.6, rx = 22 + Math.min(1, kg/fish.max) * 22;
    ctx.globalAlpha = a * .35; ctx.fillStyle = '#0a1a22';
    ctx.beginPath(); ctx.ellipse(bob.x + waitT*90, tech==='fondo' ? WATER + 100 : WATER + 40, rx, rx*.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // pesce sott'acqua durante il recupero (o in volo quando salta)
  if (S==='reel'){
    const L = fishLen();
    if (R.mode !== 'jump'){
      const d = R.mode==='warn' ? (Math.sin(now*28) > 0 ? 1 : -1) : R.mode==='charge' ? -1 : 1;
      drawFish(ctx, bob.x + 18*d, WATER + 30 + L*0.1 + R.depth, L, fish, {dir:d, wig:R.sway*2, sil:true, alpha: fish.legend ? .6 : .45, glow: fish.legend});
    }
  }

  // increspature
  ripples.forEach(r => { ctx.strokeStyle = `rgba(255,255,255,${r.a*.7})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(r.x, r.y+2, r.r, r.r*.3, 0, 0, Math.PI*2); ctx.stroke(); });

  // appoggio + personaggio
  drawStand(pl, st);
  drawKid(st);

  // filo e galleggiante
  drawLine();

  // il pesce che salta fuori dall'acqua
  if (S==='reel' && R.mode==='jump'){
    const j = jumpPos();
    drawFish(ctx, j.x, j.y, fishLen(), fish, {dir:1, wig:now*30, rot:j.rot});
  }
  // icona di avviso: che mossa sta per fare il pesce
  if (S==='reel' && R.mode==='warn'){
    const s = 1 + Math.sin(now*25)*.1, x = bob.x + 10, y = WATER - 46;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, 17); ctx.lineTo(0, 30); ctx.lineTo(6, 17); ctx.fill();
    ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(MOVE_ICON[R.next], 0, 2); ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // particelle
  particles.forEach(p => { ctx.globalAlpha = clamp(p.life,0,1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1;

  // atmosfera da boss: bordi scuri durante la lotta col leggendario
  if (fish && fish.legend && (S==='reel' || S==='bite' || (S==='wait' && omen))){
    const v = ctx.createRadialGradient(W/2, H/2, H*.35, W/2, H/2, H*.95);
    v.addColorStop(0, 'rgba(10,10,30,0)'); v.addColorStop(1, R && R.angry && S==='reel' ? 'rgba(120,0,0,.45)' : 'rgba(10,10,30,.5)');
    ctx.fillStyle = v; ctx.fillRect(-20, -20, W+40, H+40);
  }

  // interfaccia nel canvas
  if (S==='charge') drawPower(st);
  if (S==='bite') drawBang(st);
  if (S==='reel') drawReelUI();
  ctx.font = '700 15px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = '#ffffffcc'; ctx.textAlign = 'right';
  ctx.fillText(pl.name, W - 14, H - 14);
}

function drawMountains(){
  const m = [[-40,320,180,120],[120,320,330,90],[300,320,520,140],[480,320,700,100],[660,320,1000,130]];
  m.forEach(([a,b,c,top],i) => {
    const mx = (a+c)/2;
    ctx.fillStyle = i%2 ? '#7d8fa3' : '#6a7d92';
    ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(mx, top); ctx.lineTo(c,b); ctx.fill();
    ctx.fillStyle = '#f4f8fb';
    ctx.beginPath(); ctx.moveTo(mx, top); ctx.lineTo(mx-28, top+30); ctx.lineTo(mx-8, top+24); ctx.lineTo(mx+6, top+34); ctx.lineTo(mx+28, top+30); ctx.closePath(); ctx.fill();
  });
  for (let i=0;i<22;i++){ const x = i*46 + (i%3)*9, h = 40 + (i*17)%30; drawPine(x, WATER+2, h); }
  // rocce a destra
  ctx.fillStyle = '#7b7f84';
  ctx.beginPath(); ctx.ellipse(880, WATER+6, 70, 24, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(800, WATER+8, 34, 14, 0, Math.PI, 0); ctx.fill();
}
function drawPine(x, base, h){
  ctx.fillStyle = '#5b3b22'; ctx.fillRect(x-2, base-8, 4, 8);
  ctx.fillStyle = '#2f6b45';
  for (let k=0;k<3;k++){ const y = base - 8 - k*h*0.28; const w = (3-k)*7 + 4; ctx.beginPath(); ctx.moveTo(x-w, y); ctx.lineTo(x, y - h*0.45); ctx.lineTo(x+w, y); ctx.fill(); }
}
function drawHills(){
  ctx.fillStyle = '#8bbf6a'; ctx.beginPath(); ctx.moveTo(0, WATER);
  for (let x=0;x<=W;x+=20) ctx.lineTo(x, WATER - 60 - Math.sin(x/140)*28 - Math.sin(x/53)*8);
  ctx.lineTo(W, WATER); ctx.fill();
  ctx.fillStyle = '#6fa856'; ctx.beginPath(); ctx.moveTo(0, WATER);
  for (let x=0;x<=W;x+=20) ctx.lineTo(x, WATER - 26 - Math.sin(x/90+2)*14);
  ctx.lineTo(W, WATER); ctx.fill();
  // casetta
  ctx.fillStyle = '#f2e3c6'; ctx.fillRect(610, WATER-74, 34, 24);
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(604, WATER-74); ctx.lineTo(627, WATER-92); ctx.lineTo(650, WATER-74); ctx.fill();
  // canneto in primo piano
  for (let i=0;i<26;i++){
    const x = 820 + i*6 + (i%3)*3, h = 60 + (i*13)%40, sw = Math.sin(now*1.4 + i)*4;
    ctx.strokeStyle = '#4f7f2e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, WATER+20); ctx.quadraticCurveTo(x+sw*.5, WATER+20-h*.5, x+sw, WATER+20-h); ctx.stroke();
    if (i%3===0){ ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.ellipse(x+sw, WATER+14-h, 4, 11, 0, 0, Math.PI*2); ctx.fill(); }
  }
}
function drawSea(){
  // isola lontana
  ctx.fillStyle = '#8fb8c9';
  ctx.beginPath(); ctx.moveTo(560, WATER); ctx.quadraticCurveTo(640, WATER-50, 720, WATER-12); ctx.quadraticCurveTo(760, WATER-20, 800, WATER); ctx.fill();
  // barca a vela
  const bx = 380 + Math.sin(now*.2)*40;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(bx, WATER-6); ctx.lineTo(bx, WATER-50); ctx.lineTo(bx+26, WATER-8); ctx.fill();
  ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.moveTo(bx-20, WATER-6); ctx.lineTo(bx+34, WATER-6); ctx.lineTo(bx+26, WATER+2); ctx.lineTo(bx-12, WATER+2); ctx.fill();
  // faro su uno scoglio lontano
  ctx.fillStyle = '#6d7b84'; ctx.beginPath(); ctx.ellipse(909, WATER, 34, 14, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(900, WATER-80, 18, 72);
  ctx.fillStyle = '#e74c3c'; ctx.fillRect(900, WATER-60, 18, 12); ctx.fillRect(900, WATER-30, 18, 12);
  ctx.fillStyle = '#ffe680'; ctx.fillRect(898, WATER-92, 22, 12);
}
function drawWaves(pl){
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  const speed = pl.id==='torrente' ? -70 : 10;
  for (let row=0; row<7; row++){
    const y = WATER + 14 + row*30, off = ((now*speed*(1+row*.15)) % 120 + 120) % 120;
    for (let x=-120 + off + (row%2)*60; x<W; x+=120){
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x+12, y-4, x+24 + row*3, y); ctx.stroke();
    }
  }
}

function drawStand(pl, st){
  if (pl.id==='torrente'){
    ctx.fillStyle = '#8a8e94'; ctx.beginPath(); ctx.ellipse(110, st.y+40, 150, 52, 0, Math.PI, 0); ctx.lineTo(260, WATER+30); ctx.lineTo(-40, WATER+30); ctx.fill();
    ctx.fillStyle = '#a3a8ae'; ctx.beginPath(); ctx.ellipse(90, st.y+22, 90, 24, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#6aa04a'; ctx.beginPath(); ctx.ellipse(40, st.y+6, 40, 10, 0, Math.PI, 0); ctx.fill();
  } else if (pl.id==='lago'){
    ctx.fillStyle = '#7a4f2c';
    [30, 110, 200].forEach(x => ctx.fillRect(x, st.y+10, 10, WATER - st.y + 30));
    ctx.fillStyle = '#b07a46'; ctx.fillRect(0, st.y, 230, 14);
    ctx.strokeStyle = '#7a4f2c'; ctx.lineWidth = 2;
    for (let x=0;x<230;x+=26){ ctx.beginPath(); ctx.moveTo(x, st.y); ctx.lineTo(x, st.y+14); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#9aa3a8'; ctx.fillRect(0, st.y, 240, WATER - st.y + 40);
    ctx.fillStyle = '#b8c0c4'; ctx.fillRect(0, st.y, 240, 10);
    ctx.strokeStyle = '#7d868b'; ctx.lineWidth = 2;
    ctx.save(); ctx.beginPath(); ctx.rect(0, st.y, 240, WATER - st.y + 40); ctx.clip();
    for (let y=st.y+10, r=0; y<WATER+40; y+=18, r++) for (let x=(r%2)*-20; x<240; x+=40){ ctx.strokeRect(x, y, 40, 18); }
    ctx.restore();
    // secchio
    ctx.fillStyle = '#2e86de'; ctx.beginPath(); ctx.moveTo(56, st.y); ctx.lineTo(60, st.y-26); ctx.lineTo(86, st.y-26); ctx.lineTo(90, st.y); ctx.fill();
  }
}

function drawKid(st){
  const x = st.x, y = st.y;
  const hand = {x: x + 26, y: y - 28 + (S==='reel' && holding ? Math.sin(now*25)*2 : 0)};
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // gambe penzoloni
  const swing = Math.sin(now*2)*4;
  ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(x-6, y-4); ctx.lineTo(x+12, y-2); ctx.lineTo(x+16+swing, y+26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-2, y-4); ctx.lineTo(x+18, y-2); ctx.lineTo(x+24-swing, y+24); ctx.stroke();
  ctx.fillStyle = '#f5f5f5'; ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x+20+swing, y+30, 8, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x+28-swing, y+28, 8, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // busto (maglia a righe)
  ctx.fillStyle = '#2e86de'; ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 2.5;
  roundRect(x-16, y-50, 28, 48, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x-14, y-36, 24, 5); ctx.fillRect(x-14, y-24, 24, 5);
  // braccio
  ctx.strokeStyle = '#2e86de'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(x-2, y-42); ctx.lineTo(x+10, y-30); ctx.lineTo(hand.x, hand.y); ctx.stroke();
  ctx.fillStyle = '#f2c6a0'; ctx.beginPath(); ctx.arc(hand.x, hand.y, 5, 0, Math.PI*2); ctx.fill();
  // testa
  const hx = x - 2, hy = y - 66;
  ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.arc(hx-7, hy-3, 14, 0, Math.PI*2); ctx.fill(); // capelli dietro
  ctx.fillStyle = '#f2c6a0'; ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(hx, hy, 16, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.arc(hx-10, hy-2, 8, Math.PI*.5, Math.PI*1.5); ctx.fill(); // basetta
  // occhio (sbatte le palpebre)
  ctx.fillStyle = '#1d2b36';
  if ((now % 3.5) < 3.35) { ctx.beginPath(); ctx.arc(hx+8, hy-1, 2.6, 0, Math.PI*2); ctx.fill(); }
  else ctx.fillRect(hx+5, hy-1, 6, 2);
  ctx.fillStyle = '#ff9f8a'; ctx.beginPath(); ctx.arc(hx+6, hy+7, 3.5, 0, Math.PI*2); ctx.fill();
  // bocca
  ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (S==='caught') ctx.arc(hx+9, hy+7, 4, 0, Math.PI);
  else if (S==='lost') ctx.arc(hx+9, hy+11, 3, Math.PI, 0);
  else if (S==='reel' || S==='bite') ctx.ellipse(hx+11, hy+8, 2, 3, 0, 0, Math.PI*2);
  else { ctx.moveTo(hx+7, hy+8); ctx.lineTo(hx+13, hy+7); }
  ctx.stroke();
  // berretto verde con visiera
  ctx.fillStyle = '#27ae60'; ctx.strokeStyle = '#1d2b36';
  ctx.beginPath(); ctx.arc(hx, hy-4, 16, Math.PI*1.05, Math.PI*1.95); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(hx+16, hy-6, 12, 4, -.1, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f5b82e'; ctx.beginPath(); ctx.arc(hx-2, hy-19, 3, 0, Math.PI*2); ctx.fill();
  // targhetta col nome
  ctx.font = '800 15px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center';
  const tw = ctx.measureText(HERO).width + 16;
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 2;
  roundRect(hx - tw/2, hy - 50, tw, 20, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1d2b36'; ctx.fillText(HERO, hx, hy - 35);

  // canna
  const back = {x: hand.x - 18, y: hand.y + 14};
  const ctrl = {x: lerp(hand.x, tip.x, .55) + (S==='reel' ? R.ten*0.15 : 0), y: lerp(hand.y, tip.y, .55) - 14 - (S==='reel' ? R.ten*0.2 : 0)};
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(back.x, back.y); ctx.lineTo(hand.x, hand.y); ctx.stroke();
  ctx.strokeStyle = save.rod >= 4 ? '#d4a017' : ['#c8a165','#4a6fa5','#333','#8e44ad','#d4a017'][save.rod]; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.quadraticCurveTo(ctrl.x, ctrl.y, tip.x, tip.y); ctx.stroke();
  // mulinello
  ctx.fillStyle = '#95a5a6'; ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(hand.x - 8, hand.y + 10, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  if (S==='reel' && holding){ const a = now*20; ctx.beginPath(); ctx.moveTo(hand.x-8, hand.y+10); ctx.lineTo(hand.x-8+Math.cos(a)*7, hand.y+10+Math.sin(a)*7); ctx.stroke(); }
}

function fishLen(){ return fish.legend ? 140 : 40 + Math.min(1, kg/fish.max) * 45; }
function jumpPos(){ const p = 1 - R.modeT / R.dur; return { p, x: bob.x + 20 + p*60, y: WATER + 10 - Math.sin(p*Math.PI) * (fish.legend ? 150 : 115), rot: (p - .5) * 1.4 }; }
function drawLine(){
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.3;
  if (S==='reel'){ // il filo diventa rosso quando è troppo teso
    const a = clamp((R.ten - 60) / 40, 0, 1), gb = Math.round(255 - a*190);
    ctx.strokeStyle = `rgba(255,${gb},${gb},.95)`; ctx.lineWidth = 1.3 + a*1.4;
  }
  let bx, by;
  if (S==='idle' || S==='charge' || S==='lost'){
    bx = tip.x + Math.sin(now*2)*3; by = tip.y + (S==='lost' ? 40 : 70);
    ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(bx, by); ctx.stroke();
    if (S==='lost') return;
  } else if (S==='reel' && R.mode==='jump'){ // il filo segue il pesce in volo fino alla bocca
    const j = jumpPos(), half = fishLen() * .42;
    bx = j.x + Math.cos(j.rot) * half; by = j.y + Math.sin(j.rot) * half;
    ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.quadraticCurveTo((tip.x+bx)/2, Math.min(tip.y, by) + 10, bx, by); ctx.stroke();
    return;
  } else {
    bx = bob.x; by = bob.y;
    const t = S==='cast' ? save.tech : tech;
    if (by > WATER + 4){
      // esca sott'acqua (fondo, spinning, recupero): il filo entra in acqua e poi scende
      const ex = bx + (t==='fondo' && S!=='reel' ? 25 : 0), sag = S==='reel' ? (1 - R.ten/100) * 50 : t==='fondo' ? 4 : 25;
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
      ctx.quadraticCurveTo((tip.x+ex)/2, Math.max(tip.y, WATER) + sag - (WATER-tip.y)*0.15, ex, WATER); ctx.stroke();
      ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(ex, WATER); ctx.lineTo(bx, by - 4); ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      const sag = S==='reel' ? (1 - R.ten/100) * 70 : (S==='cast' ? 10 : 45);
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
      ctx.quadraticCurveTo((tip.x+bx)/2, Math.max(tip.y, by) + sag - (by-tip.y)*0.15, bx, by - 6); ctx.stroke();
    }
  }
  drawTackle(bx, by, (S==='idle' || S==='charge' || S==='cast') ? save.tech : tech);
}
// l'oggetto in fondo al filo cambia con la tecnica
function drawTackle(bx, by, t){
  ctx.save();
  ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 1.5;
  if (t === 'galleggiante'){
    const under = S==='bite';
    if (!under && S!=='cast' && S!=='idle' && S!=='charge'){ ctx.beginPath(); ctx.rect(0,0,W,WATER+3); ctx.clip(); }
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(bx, by-4, 7, Math.PI, 0); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by-4, 7, 0, Math.PI); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by-11); ctx.lineTo(bx, by-17); ctx.stroke();
    ctx.restore();
    if (under){ ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(bx, by-4, 8, 0, Math.PI*2); ctx.fill(); }
    return;
  }
  if (t === 'fondo'){        // piombo + amo con l'esca
    ctx.fillStyle = '#6b737a'; ctx.beginPath(); ctx.ellipse(bx, by-4, 5, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c9a227'; ctx.beginPath(); ctx.arc(bx+8, by+2, 4, 0, Math.PI); ctx.stroke();
    ctx.fillStyle = '#c0705a'; ctx.beginPath(); ctx.arc(bx+10, by+4, 3, 0, Math.PI*2); ctx.fill();
  }
  else if (t === 'spinning'){  // cucchiaino che gira e luccica
    const w = 3 + Math.abs(Math.sin(now*18)) * 6;
    ctx.fillStyle = '#d9dee2'; ctx.beginPath(); ctx.ellipse(bx, by-2, w, 9, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(bx - w*.3, by-5, w*.35, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(bx, by-12, 2.5, 0, Math.PI*2); ctx.fill();
  }
  else if (t === 'mosca'){     // mosca: corpo marrone e ali bianche
    if (S==='bite'){ ctx.restore(); return; }   // il pesce se l'è presa
    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.ellipse(bx, by-3, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.ellipse(bx-3, by-8, 2.5, 5, -.5, 0, Math.PI*2); ctx.ellipse(bx+3, by-8, 2.5, 5, .5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d97a2b'; ctx.beginPath(); ctx.moveTo(bx-5, by-3); ctx.lineTo(bx-9, by-1); ctx.stroke();
  }
  ctx.restore();
}

function drawPower(st){
  const x = st.x - 70, y = st.y - 130, w = 170, h = 20;
  ctx.fillStyle = '#1d2b36'; roundRect(x-4, y-4, w+8, h+8, 10); ctx.fill();
  const g = ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#2ecc71'); g.addColorStop(.6,'#f1c40f'); g.addColorStop(1,'#e74c3c');
  ctx.fillStyle = g; roundRect(x, y, w*power, h, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 14px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center';
  ctx.fillText('FORZA DEL LANCIO', x + w/2, y - 10);
}
function drawBang(st){
  const x = st.x + 10, y = st.y - 120, s = 1 + Math.sin(now*20)*.08;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#f5b82e'; ctx.strokeStyle = '#1d2b36'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1d2b36'; ctx.font = '800 34px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('!', 0, 2); ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
function drawReelUI(){
  const font = getComputedStyle(document.body).fontFamily;
  // barra tensione verticale
  const x = 880, y = 70, w = 30, h = 300;
  ctx.fillStyle = '#1d2b36'; roundRect(x-5, y-5, w+10, h+10, 12); ctx.fill();
  const zones = [[0,60,'#2ecc71'],[60,85,'#f1c40f'],[85,100,'#e74c3c']];
  zones.forEach(([a,b,c]) => { ctx.fillStyle = c; ctx.fillRect(x, y + h*(1-b/100), w, h*(b-a)/100); });
  const ty = y + h*(1 - Math.min(R.ten,100)/100);
  const flash = R.ten >= 85 && Math.floor(now*10)%2;
  ctx.fillStyle = flash ? '#fff' : '#1d2b36';
  ctx.beginPath(); ctx.moveTo(x-14, ty-8); ctx.lineTo(x-2, ty); ctx.lineTo(x-14, ty+8); ctx.fill();
  ctx.fillRect(x, ty-2, w, 4);
  ctx.save(); ctx.translate(x + w + 22, y + h/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle = '#fff'; ctx.font = '800 16px ' + font; ctx.textAlign = 'center'; ctx.fillText('TENSIONE', 0, 0);
  ctx.restore();

  // barra distanza
  const dx = 330, dy = 104, dw = 300, dh = 16;
  ctx.fillStyle = '#1d2b36'; roundRect(dx-4, dy-4, dw+8, dh+8, 10); ctx.fill();
  ctx.fillStyle = '#7fd3ff'; roundRect(dx, dy, dw*(1-R.dist/100), dh, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 15px ' + font; ctx.textAlign = 'center';
  const lbl = { calm:'🐟 in arrivo...', warn:'👀 attento...', run:'⚡ SCAPPA!', jump:'🐬 SALTA!', charge:'↩️ TI VIENE INCONTRO!', dive:'⬇️ VA SUL FONDO' }[R.mode];
  if (fish.legend){
    ctx.font = '800 22px ' + font; ctx.fillStyle = R.angry ? '#ff8a7a' : '#ffd84a';
    ctx.fillText(`⭐ ${fish.name.toUpperCase()} ⭐${R.angry ? ' 😡' : ''}`, dx + dw/2, dy - 32);
    ctx.font = '800 15px ' + font; ctx.fillStyle = '#fff';
  }
  ctx.fillText(lbl, dx + dw/2, dy - 10);
  ctx.textAlign = 'left'; ctx.fillText('🧒', dx - 30, dy + 14);
}
function roundRect(x,y,w,h,r){ w = Math.max(w, 0); r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---------------- MESSAGGI ---------------- */
const msgEl = document.getElementById('msg');
let lastMsg = '';
function hintText(){
  if (now < tmpMsg.until) return tmpMsg.t;
  const key = matchMedia('(pointer:fine)').matches ? 'Tieni premuto (o SPAZIO)' : 'Tieni premuto';
  switch (S){
    case 'idle': return `🎣 ${key} per caricare il lancio, poi lascia!`;
    case 'charge': return 'Lascia andare per lanciare! Più lontano = pesci più rari ⭐';
    case 'cast': return 'Vola!';
    case 'wait':
      if (tech === 'fondo') return '👀 Guarda la punta della canna: quando trema forte e suona il campanello, clicca!';
      if (tech === 'mosca') return '👀 Occhio alla mosca: quando un pesce la prende, clicca SUBITO!';
      return '👀 Aspetta... quando il galleggiante va SOTTO, clicca!';
    case 'spin': return holding ? '🥄 Recupera... i predatori inseguono l\'esca!' : `${key} per far nuotare l'esca verso di te`;
    case 'bite':
      if (tech === 'fondo') return '🔔 Driiin! ABBOCCA! CLICCA!';
      if (tech === 'mosca') return '💦 L\'ha presa! CLICCA SUBITO!';
      if (tech === 'spinning') return '💥 Attacco! CLICCA SUBITO!';
      return '❗ ABBOCCA! CLICCA SUBITO!';
    case 'reel':
      if (R.ten >= 85) return '🔥 TROPPO TESA! MOLLA!';
      if (R.mode==='warn') return '👀 Attento! Guarda l\'icona: sta per fare una mossa...';
      if (R.mode==='run') return '⚡ Scappa! Molla un attimo!';
      if (R.mode==='jump') return '🐬 Salta fuori dall\'acqua! Molla la presa!';
      if (R.mode==='charge') return holding ? '↩️ Ti viene incontro: recupera, recupera!' : '↩️ Ti viene incontro! TIENI PREMUTO e recupera!';
      if (R.mode==='dive') return '⬇️ Va sul fondo: tieni premuto, con calma';
      if (R.slack > 1.2) return '😴 Lenza molle: tieni premuto e recupera!';
      return holding ? '🌀 Recupera, recupera...' : `${key} per recuperare il filo`;
    default: return '';
  }
}

/* ---------------- LOOP ---------------- */
let last = performance.now();
function frame(t){
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (!UI.open || S==='caught') update(UI.open ? 0 : dt);
  draw();
  const m = hintText(); if (m !== lastMsg){ msgEl.textContent = m; msgEl.style.display = m ? '' : 'none'; lastMsg = m; }
  hudTick(S);
  requestAnimationFrame(frame);
}
initUI({
  title: "Lenza d'Oro",
  state: () => S,
  toIdle: () => setState('idle'),
  say: (t, d) => say(t, d),
  onOpen: () => { holding = false; },
  onPlaceChange: () => {},
});
requestAnimationFrame(frame);

// piccolo aiuto per i test dal browser
window.__game = { get state(){ return S; }, get spinT(){ return spinT; }, get R(){ return R; }, get fish(){ return fish; }, get kg(){ return kg; }, save,
  press, release, force(id){ forceFish = id; }, tick(n=1){ for (let i=0;i<n;i++) if (!UI.open || S==='caught') update(1/60); draw(); } };
</script>
