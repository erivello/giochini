<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brummè Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comune.css">
<style>
body{background:#ffe6b8;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stageWrap{position:relative;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,2vh,16px);padding:clamp(8px,2vh,16px) 14px;background:#fff7e6;
  border-left:6px solid #e9b65f;min-height:0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}
.row{--n:5;--ar:1.35;--mh:15vh}
#rowColor{--n:7;--ar:1}
#rowWheels,#rowFace{--n:4;--ar:1}
.opt{flex:0 0 auto;background:#fff;border-radius:18px;border:4px solid #e3d3b5;box-shadow:0 4px 0 rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;padding:2px;aspect-ratio:var(--ar);
  width:min(calc((100% - (var(--n) - 1) * 8px) / var(--n)), calc(var(--mh) * var(--ar)))}
.opt canvas{width:100%;height:100%;display:block}
.opt.sw{aspect-ratio:1;border-radius:50%;border-color:#fff}
.opt.sel{border-color:#2ecc71;box-shadow:0 0 0 4px #2ecc71,0 4px 0 rgba(0,0,0,.12);transform:scale(1.06)}
.opt:active{transform:translateY(3px) scale(.96)}
#go{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));width:auto;height:auto;border-radius:32px;padding:4px 26px 2px;font-size:clamp(30px,8vh,46px);
  font-weight:800;background:var(--go);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);animation:pulse 1.4s ease-in-out infinite;display:flex;gap:6px}
#dice{position:absolute;left:16px;bottom:calc(14px + env(safe-area-inset-bottom));width:clamp(64px,16vh,84px);height:clamp(64px,16vh,84px);font-size:clamp(34px,9vh,46px)}
@media (orientation:portrait){
  body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #panel{border-left:0;border-top:6px solid #e9b65f}
  .row{--mh:9vh}
}
</style>
</head>
<body>
<div id="stageWrap">
  <canvas id="stage"></canvas>
  <button class="big" id="dice" aria-label="Sorpresa">🎲</button>
  <button class="big" id="go" aria-label="Via!">🏁 Via!</button>
</div>
<div id="panel">
  <div class="row" id="rowBody"></div>
  <div class="row" id="rowColor"></div>
  <div class="row" id="rowWheels"></div>
  <div class="row" id="rowFace"></div>
</div>
<div class="bar left"><a class="round" href="index.html" aria-label="Menu">🏠</a></div>
<div class="bar right"><button class="round" id="soundBtn" aria-label="Suono">🔊</button></div>

<script src="comune.js"></script>
<script>
(function(){
'use strict';
const B = window.Brumme, $ = id => document.getElementById(id);
const car = B.save.car;
const cv = $('stage');
let t = 0, last = performance.now();
let squash = 0, squashV = 0, hop = 0, hopV = 0, happy = 0, blink = 0, arm = 0, armT = 0;
let leaving = -1, carX = 0;

/* ---------- pulsanti delle opzioni ---------- */
function makeOpt(row, cls, onTap, draw){
  const b = document.createElement('button'); b.className = 'opt ' + cls;
  const c = document.createElement('canvas'); b.appendChild(c);
  b.addEventListener('click', e => { e.stopPropagation(); onTap(); refresh(); bounce(); });
  $(row).appendChild(b);
  return { b, c, draw };
}
const opts = [];
B.BODIES.forEach(o => opts.push({ key:'body', id:o.id, ...makeOpt('rowBody', '', () => choose('body', o), (c, w, h) => {
  const cc = { ...car, body:o.id, face:'felice' };
  const s = Math.min(w / 250, h / (B.carHeight(cc) + 16));
  B.drawCar(c, cc, w / 2, h - 6, s, { noShadow:true, arm:0.5 });
}) }));
B.COLORS.forEach(o => {
  const x = makeOpt('rowColor', 'sw', () => choose('color', o), null);
  x.b.style.background = o.hex; x.b.removeChild(x.c); x.c = null;
  opts.push({ key:'color', id:o.id, ...x });
});
B.WHEELS.forEach(o => opts.push({ key:'wheels', id:o.id, ...makeOpt('rowWheels', 'sq', () => choose('wheels', o), (c, w, h) => {
  const R = o.id === 'giganti' ? 34 : 23, s = Math.min(w, h) / 2 / 36;
  c.save(); c.translate(w / 2, h / 2); c.scale(s, s); c.translate(0, 0); B.drawWheel(c, 0, R, o.id, t * 2); c.restore();
}) }));
B.FACES.forEach(o => opts.push({ key:'face', id:o.id, ...makeOpt('rowFace', 'sq', () => choose('face', o), (c, w, h) => {
  const r = Math.min(w, h) / 2 - 2;
  c.beginPath(); c.arc(w / 2, h / 2, r, 0, Math.PI * 2); c.fillStyle = '#bfe8ff'; c.fill();
  B.drawFace(c, w / 2, h / 2 - r * 0.08, r / 30, o.id, {});
}) }));

function choose(key, o){
  if (leaving >= 0) return;
  car[key] = o.id; B.persist();
  B.sfx.ding();
  if (key === 'color') B.burst(stageW / 2, stageH * 0.55, { n:30, colors:[o.hex], speed:380 });
  else B.burst(stageW / 2, stageH * 0.55, { n:16, emoji:['⭐', '✨'], size:26, speed:320 });
  if (key === 'face' && o.id === 'ride') happy = 1;
  B.say(o.nome);
}
function refresh(){
  opts.forEach(o => o.b.classList.toggle('sel', car[o.key] === o.id));
  opts.forEach(o => { if (!o.c || !o.draw) return; const { c, w, h } = B.fitCanvas(o.c); c.clearRect(0, 0, w, h); o.draw(c, w, h); });
}
function bounce(){ squashV = 7; hopV = -420; }

/* ---------- tocco sulla macchinina ---------- */
cv.addEventListener('pointerdown', () => {
  if (leaving >= 0) return;
  B.sfx.clacson(); happy = 1.1; hopV = -560; armT = 1;
  B.burst(stageW / 2, stageH * 0.45, { n:8, emoji:['🎵', '🎶'], size:30, speed:260, g:-80, life:1.2 });
});
$('dice').addEventListener('click', e => {
  e.stopPropagation(); if (leaving >= 0) return;
  Object.assign(car, B.randomCar()); B.persist(); refresh(); bounce();
  B.sfx.boing(); B.burst(stageW / 2, stageH * 0.5, { n:40, speed:450 }); B.say('Sorpresa!');
});
$('go').addEventListener('click', e => {
  e.stopPropagation(); if (leaving >= 0) return;
  leaving = 0; B.sfx.brum(); B.say('Brummè!', 200);
});

/* ---------- disegno ---------- */
let stageW = 300, stageH = 300;
function drawGarage(c, w, h){
  // muro
  c.fillStyle = '#ffd08a'; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.25)';
  for (let y = 0; y < h * 0.72; y += 34) for (let x = (y / 34) % 2 ? -40 : 0; x < w; x += 80) { B.rr(c, x + 3, y + 3, 74, 28, 5); c.fill(); }
  // insegna
  const sw = Math.min(w * 0.5, 300), sx = w / 2 - sw / 2, sy = Math.max(74, h * 0.06);
  B.rr(c, sx, sy, sw, sw * 0.22, 14); c.fillStyle = '#e8322f'; c.fill(); c.lineWidth = 4; c.strokeStyle = B.INK; c.stroke();
  c.fillStyle = '#fff'; c.font = '800 ' + Math.round(sw * 0.15) + 'px "Baloo 2",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('🔧 GARAGE', w / 2, sy + sw * 0.12);
  // pavimento a scacchi
  const fy = h * 0.72;
  c.fillStyle = '#c9ced8'; c.fillRect(0, fy, w, h - fy);
  c.fillStyle = '#b3b9c5';
  const tile = 46;
  for (let y = fy, r = 0; y < h; y += tile, r++) for (let x = (r % 2) * tile; x < w; x += tile * 2) c.fillRect(x, y, tile, tile);
  c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(0, fy, w, 6);
}

function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const { c, w, h } = B.fitCanvas(cv); stageW = w; stageH = h;
  drawGarage(c, w, h);
  // pedana girevole
  const fy = h * 0.72, cy = fy + (h - fy) * 0.45;
  c.save(); c.translate(w / 2, cy); c.scale(1, 0.28);
  c.beginPath(); c.arc(0, 0, Math.min(w * 0.42, 260), 0, Math.PI * 2); c.fillStyle = '#7d8796'; c.fill(); c.lineWidth = 8; c.strokeStyle = B.INK; c.stroke();
  c.rotate(t * 0.6); c.fillStyle = '#ffd43b';
  for (let i = 0; i < 8; i++){ c.rotate(Math.PI / 4); c.beginPath(); c.arc(Math.min(w * 0.42, 260) * 0.8, 0, 9, 0, Math.PI * 2); c.fill(); }
  c.restore();

  // fisica dei rimbalzi
  squashV += (-squash * 160 - squashV * 9) * dt; squash += squashV * dt;
  hopV += 1700 * dt; hop += hopV * dt; if (hop > 0){ hop = 0; hopV = 0; }
  happy -= dt; blink -= dt; if (blink < -3) blink = 0.14;
  if (armT > 0){ armT -= dt * 0.7; } arm = Math.sin(Math.max(0, armT) * Math.PI);

  const s = Math.min(w / 300, (cy - 60) / (B.carHeight(car) + 10)) * 0.95;
  let wheelRot = 0;
  if (leaving >= 0){
    leaving += dt;
    if (leaving < 0.9){ squash = Math.sin(leaving * 60) * 0.03; }
    else { const k = leaving - 0.9; carX = k * k * 1400; wheelRot = carX / 25; if (Math.random() < 0.5) B.burst(w / 2 + carX - 110 * s, cy - 20, { n:1, emoji:['💨'], size:34, speed:120, g:-50, life:0.8 }); }
    if (leaving > 2.1){ location.href = 'strada.html'; leaving = -99; }
  }
  B.drawCar(c, car, w / 2 + carX, cy + hop, s, { squash, happy:happy > 0, blink:blink > 0, arm, t, wheelRot });
  B.drawParts(c, dt);
  if (Math.floor(t * 4) !== Math.floor((t - dt) * 4)) opts.forEach(o => { if (o.key === 'wheels' && car.wheels === o.id){ const r = B.fitCanvas(o.c); r.c.clearRect(0, 0, r.w, r.h); o.draw(r.c, r.w, r.h); } });
  requestAnimationFrame(frame);
}
addEventListener('resize', refresh);
if (document.fonts) document.fonts.ready.then(refresh);
refresh();
requestAnimationFrame(frame);
})();
</script>
<script src="../schermo-intero.js" data-after="soundBtn"></script>
</body>
</html>
