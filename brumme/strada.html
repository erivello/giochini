<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brummè Strada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comune.css">
<style>
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#score{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card);border-radius:24px;
  padding:2px 20px 0;font-size:32px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.18);z-index:10}
#score.bump{animation:pulse .35s}
#horn{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:10}
</style>
</head>
<body data-landscape>
<canvas id="c"></canvas>
<div id="score">⭐ <span id="nStars">0</span></div>
<button class="big" id="horn" aria-label="Clacson">📯</button>
<div class="bar left"><a class="round" href="index.html" aria-label="Menu">🏠</a><a class="round" href="garage.html" aria-label="Garage">🔧</a></div>
<div class="bar right"><button class="round" id="soundBtn" aria-label="Suono">🔊</button></div>

<script src="comune.js"></script>
<script>
(function(){
'use strict';
const B = window.Brumme, $ = id => document.getElementById(id);
const car = B.save.car, cv = $('c');
const rand = (a, b) => a + Math.random() * (b - a);

let W = 800, H = 600, roadTop = 0, roadBot = 0, laneH = 0, carS = 1;
let t = 0, last = performance.now(), dist = 0;
let lane = 1, laneY = 1, hop = 0, hopV = 0, squash = 0, squashV = 0, happy = 0, blink = 0, wheelRot = 0;
let items = [], spawnT = 1, events = [], nextEvent = 9, eventIdx = 0, washT = 0, inWash = false, wasInTunnel = false;
let clouds = [], deco = [];
let started = false;
$('nStars').textContent = B.save.stars;

function layout(){
  roadTop = H * 0.5; roadBot = H * 0.97; laneH = (roadBot - roadTop) / 3;
  carS = laneH * 1.7 / B.carHeight(car);
}
const laneGround = l => roadTop + laneH * (l + 0.78);
const speed = () => W * 0.38;

/* ---------- comandi ---------- */
function setLane(l){
  l = Math.max(0, Math.min(2, l));
  if (l !== lane){ lane = l; B.sfx.whoosh(); squashV = 4; }
}
cv.addEventListener('pointerdown', e => {
  started = true;
  const y = e.clientY, carX = W * 0.22, cy = laneGround(laneY);
  // tocco sulla macchinina = clacson
  if (Math.abs(e.clientX - carX) < 110 * carS && y > cy - B.carHeight(car) * carS && y < cy + 10){ honk(); return; }
  if (y < roadTop) setLane(lane - 1);
  else if (y > roadBot) setLane(lane + 1);
  else setLane(Math.floor((y - roadTop) / laneH));
});
function honk(){
  B.sfx.clacson(); happy = 1; hopV = -500;
  B.burst(W * 0.22, laneGround(laneY) - B.carHeight(car) * carS, { n:6, emoji:['🎵', '🎶'], size:30, speed:220, g:-60, life:1.1 });
}
$('horn').addEventListener('pointerdown', e => { e.stopPropagation(); started = true; honk(); });

/* ---------- oggetti sulla strada ---------- */
const GOODIES = ['⭐', '⭐', '⭐', '🎈', '🍎', '🍌', '🍓', '🍒', '🍦'];
function spawn(){
  const l = Math.floor(Math.random() * 3);
  const r = Math.random();
  const kind = r < 0.78 ? 'goody' : r < 0.9 ? 'cono' : 'pozza';
  items.push({ kind, lane:l, x:W + 80, e:B.pick(GOODIES), phase:rand(0, 6), hit:false, vy:0, y:0, rot:0, vr:0 });
}
function collect(it){
  it.hit = true;
  const x = it.x, y = laneGround(it.lane) - laneH * 0.7;
  if (it.kind === 'goody'){
    B.sfx.pop(); B.burst(x, y, { n:14, speed:300 });
    B.burst(x, y, { n:4, emoji:[it.e], size:28, speed:250, life:0.9 });
    B.save.stars++; B.persist(); $('nStars').textContent = B.save.stars;
    const sc = $('score'); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump');
    if (B.save.stars % 10 === 0){
      B.sfx.yay(); happy = 2; B.say(B.pick(['Bravo!', 'Evviva!', 'Bravissimo!', 'Che forte!']), 500);
      for (let i = 0; i < 4; i++) B.burst(rand(W * 0.2, W * 0.8), rand(H * 0.1, H * 0.4), { n:30, speed:400 });
    }
  } else if (it.kind === 'cono'){
    B.sfx.boing(); hopV = -700; happy = 0.8; it.vy = -900; it.vr = rand(8, 14);
  } else {
    B.sfx.splash(); squashV = 6;
    B.burst(x, laneGround(it.lane), { n:22, colors:['#7cc8ff', '#b8e4ff', '#4aa8f0'], speed:380, up:true, size:9 });
  }
}

/* ---------- posti speciali: galleria, ponte, autolavaggio ---------- */
const EVENTS = ['galleria', 'ponte', 'lavaggio'];
// per provare: strada.html#ponte
if (EVENTS.includes(location.hash.slice(1))){ eventIdx = EVENTS.indexOf(location.hash.slice(1)); nextEvent = 1.5; }
function startEvent(){
  const type = EVENTS[eventIdx++ % EVENTS.length];
  const len = type === 'lavaggio' ? Math.max(260, W * 0.32) : W * 1.5;
  events.push({ type, x:W + 40, len, said:false, done:false });
}

/* ---------- scenario ---------- */
function initScenery(){
  clouds = []; for (let i = 0; i < 5; i++) clouds.push({ x:rand(0, W), y:rand(H * 0.06, H * 0.26), s:rand(0.7, 1.3) });
  deco = []; for (let x = 0; x < W + 300; x += rand(90, 170)) deco.push(newDeco(x));
}
function newDeco(x){ return { x, k:B.pick(['albero', 'albero', 'casa', 'fiori', 'albero']), col:B.pick(['#ff8a8a', '#8ac6ff', '#ffd36b', '#b98aff']), s:rand(0.85, 1.2) }; }
function drawTree(c, x, y, s){
  c.fillStyle = '#8a5a2b'; c.fillRect(x - 6 * s, y - 40 * s, 12 * s, 40 * s);
  c.fillStyle = '#3fae4f'; c.beginPath(); c.arc(x, y - 56 * s, 30 * s, 0, Math.PI * 2); c.arc(x - 18 * s, y - 40 * s, 20 * s, 0, Math.PI * 2); c.arc(x + 18 * s, y - 40 * s, 20 * s, 0, Math.PI * 2); c.fill();
}
function drawHouse(c, x, y, s, col){
  c.fillStyle = col; c.fillRect(x - 34 * s, y - 52 * s, 68 * s, 52 * s);
  c.fillStyle = '#d9443a'; c.beginPath(); c.moveTo(x - 42 * s, y - 50 * s); c.lineTo(x, y - 86 * s); c.lineTo(x + 42 * s, y - 50 * s); c.fill();
  c.fillStyle = '#bfe8ff'; c.fillRect(x - 24 * s, y - 40 * s, 16 * s, 16 * s); c.fillRect(x + 8 * s, y - 40 * s, 16 * s, 16 * s);
  c.fillStyle = '#8a5a2b'; c.fillRect(x - 8 * s, y - 22 * s, 16 * s, 22 * s);
}
function drawCloud(c, x, y, s){
  c.fillStyle = 'rgba(255,255,255,.95)'; c.beginPath();
  c.arc(x, y, 26 * s, 0, Math.PI * 2); c.arc(x + 28 * s, y - 10 * s, 30 * s, 0, Math.PI * 2); c.arc(x + 58 * s, y, 24 * s, 0, Math.PI * 2); c.fill();
}
function drawCone(c, x, y, s, rot){
  c.save(); c.translate(x, y); c.rotate(rot || 0); c.scale(s, s);
  c.beginPath(); c.moveTo(-22, 0); c.lineTo(-7, -56); c.lineTo(7, -56); c.lineTo(22, 0); c.closePath();
  c.fillStyle = '#ff7a1a'; c.fill(); c.lineWidth = 3; c.strokeStyle = B.INK; c.stroke();
  c.fillStyle = '#fff'; c.fillRect(-13, -36, 26, 9);
  B.rr(c, -28, -4, 56, 8, 3); c.fillStyle = '#ff7a1a'; c.fill(); c.stroke();
  c.restore();
}

function drawBackground(c, scroll){
  const hz = H * 0.42;
  const sky = c.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, '#6cc6ff'); sky.addColorStop(1, '#cdeeff');
  c.fillStyle = sky; c.fillRect(0, 0, W, hz + 2);
  c.fillStyle = '#ffe066'; c.beginPath(); c.arc(W * 0.86, H * 0.12, H * 0.07, 0, Math.PI * 2); c.fill();
  clouds.forEach(cl => drawCloud(c, cl.x, cl.y, cl.s * H / 600));
  // colline (lontane, lente)
  c.fillStyle = '#9bd47a';
  c.beginPath(); c.moveTo(0, hz + 10);
  for (let x = 0; x <= W + 20; x += 20) c.lineTo(x, hz - 30 - Math.sin((x + scroll * 0.15) / 140) * 26 - Math.sin((x + scroll * 0.15) / 57) * 10);
  c.lineTo(W, hz + 10); c.fill();
  c.fillStyle = '#7cc45f'; c.fillRect(0, hz, W, roadTop - hz);
  deco.forEach(d => {
    if (events.some(ev => ev.type === 'ponte' && d.x > ev.x - 40 && d.x < ev.x + ev.len + 40)) return;
    const y = roadTop - 8, s = d.s * H / 600;
    if (d.k === 'albero') drawTree(c, d.x, y, s);
    else if (d.k === 'casa') drawHouse(c, d.x, y, s, d.col);
    else { c.fillStyle = '#000'; c.font = 22 * s + 'px sans-serif'; c.textAlign = 'center'; c.fillText('🌼🌷', d.x, y - 4); }
  });
}
function drawRoad(c, scroll){
  c.fillStyle = '#c7ccd4'; c.fillRect(0, roadTop - 8, W, 8);
  c.fillStyle = '#4b5361'; c.fillRect(0, roadTop, W, roadBot - roadTop);
  c.fillStyle = '#7cc45f'; c.fillRect(0, roadBot, W, H - roadBot);
  c.fillStyle = 'rgba(255,255,255,.85)';
  const dash = 70, off = scroll % (dash * 2);
  for (let l = 1; l < 3; l++){ const y = roadTop + laneH * l - 3; for (let x = -off; x < W; x += dash * 2) c.fillRect(x, y, dash, 6); }
}

function drawEventBack(c, ev){
  const x0 = ev.x, x1 = ev.x + ev.len;
  if (x1 < -50 || x0 > W + 50) return;
  if (ev.type === 'ponte'){
    // fiume sotto e dietro
    c.fillStyle = '#3fa7e8'; c.fillRect(x0, H * 0.42, ev.len, roadTop - H * 0.42);
    c.fillRect(x0, roadBot, ev.len, H - roadBot);
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 3;
    for (let x = x0 + 20; x < x1 - 20; x += 60){ c.beginPath(); c.arc(x + Math.sin(t * 2 + x) * 6, H * 0.47 + (x % 3) * 12, 10, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
    c.fillStyle = '#000'; c.font = H * 0.08 + 'px sans-serif'; c.textAlign = 'center';
    c.fillText('⛵', x0 + ev.len * 0.4, H * 0.47);
    const fx = x0 + ev.len * 0.7, jump = Math.max(0, Math.sin(t * 2.5)) * H * 0.07;
    c.fillText('🐟', fx, roadTop - 4 - jump);
  }
  if (ev.type === 'galleria'){
    // montagna
    c.fillStyle = '#8c7a6b';
    c.beginPath(); c.moveTo(x0 - 60, roadTop); c.quadraticCurveTo(x0 + ev.len * 0.1, H * 0.02, x0 + ev.len * 0.5, H * 0.06);
    c.quadraticCurveTo(x1 - ev.len * 0.1, H * 0.02, x1 + 60, roadTop); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(x0 + ev.len * 0.38, H * 0.1); c.lineTo(x0 + ev.len * 0.5, H * 0.06); c.lineTo(x0 + ev.len * 0.62, H * 0.1); c.fill();
  }
}
function drawEventFront(c, ev){
  const x0 = ev.x, x1 = ev.x + ev.len;
  if (x1 < -50 || x0 > W + 50) return;
  if (ev.type === 'galleria'){
    // dentro è buio
    c.fillStyle = 'rgba(20,22,40,.82)'; c.fillRect(x0, roadTop - laneH * 1.4, ev.len, roadBot - roadTop + laneH * 1.4);
    for (let x = x0 + 40; x < x1; x += 120){ c.fillStyle = '#ffe680'; c.beginPath(); c.arc(x, roadTop - laneH * 1.25, 7, 0, Math.PI * 2); c.fill(); }
    // archi d'ingresso
    c.fillStyle = '#6e5f53';
    c.fillRect(x0 - 26, roadTop - laneH * 1.6, 30, roadBot - roadTop + laneH * 1.6);
    c.fillRect(x1 - 4, roadTop - laneH * 1.6, 30, roadBot - roadTop + laneH * 1.6);
  }
  if (ev.type === 'ponte'){
    c.fillStyle = '#c0392b';
    [roadTop - 6, roadBot + 4].forEach(y => {
      c.fillRect(x0, y - 18, ev.len, 6);
      for (let x = x0; x <= x1; x += 40) c.fillRect(x, y - 18, 6, 22);
    });
  }
  if (ev.type === 'lavaggio'){
    const top = roadTop - laneH * 1.5;
    c.fillStyle = '#4fa3ff'; c.fillRect(x0, top, ev.len, 28); c.lineWidth = 4; c.strokeStyle = B.INK; c.strokeRect(x0, top, ev.len, 28);
    c.fillStyle = '#fff'; c.font = '800 22px "Baloo 2",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('🫧 LAVAGGIO 🫧', x0 + ev.len / 2, top + 15);
    c.fillStyle = '#4fa3ff'; c.fillRect(x0, top, 18, roadBot - top); c.fillRect(x1 - 18, top, 18, roadBot - top);
    // spazzoloni che girano (un po' trasparenti, per vedere la macchinina)
    const bh = roadBot - top - 40;
    [x0 + ev.len * 0.3, x0 + ev.len * 0.7].forEach((bx, i) => {
      c.save(); c.globalAlpha = 0.55; B.rr(c, bx - 22, top + 30, 44, bh, 20); c.clip();
      const cols = ['#ff6fb5', '#ffd43b', '#45d483', '#4fc3ff'], st = 22, off = (t * 160 * (i ? 1 : -1)) % (st * 4);
      for (let y = top + 30 - st * 4 + off, k = 0; y < top + 30 + bh + st * 4; y += st, k++){ c.fillStyle = cols[((k % 4) + 4) % 4]; c.fillRect(bx - 22, y, 44, st); }
      c.restore();
    });
  }
}

/* ---------- ciclo principale ---------- */
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const r = B.fitCanvas(cv), c = r.c;
  if (r.w !== W || r.h !== H){ W = r.w; H = r.h; layout(); if (!deco.length) initScenery(); }
  const v = speed(), dx = v * dt; dist += dx;
  const carX = W * 0.22;

  // movimento di tutto
  clouds.forEach(cl => { cl.x -= dx * 0.05; if (cl.x < -120) { cl.x = W + 40; cl.y = rand(H * 0.06, H * 0.26); } });
  deco.forEach(d => d.x -= dx * 0.6);
  deco = deco.filter(d => d.x > -80);
  while (!deco.length || deco[deco.length - 1].x < W + 80) deco.push(newDeco((deco.length ? deco[deco.length - 1].x : W) + rand(90, 170)));
  items.forEach(it => { it.x -= dx; if (it.hit && it.kind === 'cono'){ it.vy += 2200 * dt; it.y += it.vy * dt; it.rot += it.vr * dt; it.x += dx * 0.3; } });
  items = items.filter(it => it.x > -100 && it.y < H);
  events.forEach(ev => ev.x -= dx);
  events = events.filter(ev => ev.x + ev.len > -100);

  spawnT -= dt;
  const busy = events.some(ev => ev.type === 'lavaggio' && ev.x < W + 60 && ev.x + ev.len > carX - 100);
  if (spawnT <= 0){ spawnT = rand(0.7, 1.3); if (!busy) spawn(); }
  nextEvent -= dt;
  if (nextEvent <= 0 && !events.length){ startEvent(); nextEvent = rand(14, 20); }

  // macchinina
  laneY += (lane - laneY) * Math.min(1, dt * 9);
  hopV += 2400 * dt; hop += hopV * dt; if (hop > 0){ hop = 0; if (hopV > 300){ squashV = 5; } hopV = 0; }
  squashV += (-squash * 160 - squashV * 9) * dt; squash += squashV * dt;
  happy -= dt; blink -= dt; if (blink < -3) blink = 0.14;
  wheelRot += dx / (23 * carS);

  // urti
  items.forEach(it => {
    if (it.hit) return;
    if (Math.abs(it.x - carX) < 95 * carS && Math.abs(it.lane - laneY) < 0.5 && hop > -60) collect(it);
  });

  // posti speciali
  let inTunnel = false; inWash = false;
  events.forEach(ev => {
    const inside = carX > ev.x && carX < ev.x + ev.len;
    if (ev.type === 'galleria' && inside) inTunnel = true;
    if (ev.type === 'lavaggio' && inside) inWash = true;
    if (inside && !ev.said){
      ev.said = true;
      if (ev.type === 'galleria'){ B.say('Galleria! Uuuh!'); }
      if (ev.type === 'ponte'){ B.say('Il ponte!'); }
      if (ev.type === 'lavaggio'){ B.say('Autolavaggio!'); }
    }
    if (ev.type === 'lavaggio' && !ev.done && carX > ev.x + ev.len){
      ev.done = true; B.sfx.ding(); happy = 1.5;
      B.burst(carX, laneGround(laneY) - B.carHeight(car) * carS * 0.5, { n:18, emoji:['✨', '⭐'], size:30, speed:300 });
      B.say('Che pulita!', 200);
    }
  });
  if (inWash){
    washT -= dt;
    if (washT <= 0){ washT = 0.35; B.sfx.bolle(); }
    if (Math.random() < 0.6) B.burst(carX + rand(-80, 80) * carS, laneGround(laneY) - rand(20, 120) * carS, { n:1, bubble:true, size:rand(8, 18), speed:60, g:-120, life:1.6 });
  }
  if (inTunnel && !wasInTunnel) B.sfx.whoosh();
  wasInTunnel = inTunnel;

  // disegno
  drawBackground(c, dist);
  events.forEach(ev => drawEventBack(c, ev));
  drawRoad(c, dist);
  events.forEach(ev => { if (ev.type !== 'lavaggio') drawEventFront(c, ev); });

  // oggetti e macchinina in ordine di corsia (dietro → davanti)
  const draws = items.map(it => ({ y:it.lane, f:() => drawItem(c, it) }));
  draws.push({ y:laneY + 0.01, f:() => {
    B.drawCar(c, car, carX, laneGround(laneY) + hop, carS, { wheelRot, squash, happy:happy > 0, blink:blink > 0, lights:inTunnel, t, arm:(Math.sin(t * 3) + 1) / 2 * 0.4 });
  } });
  draws.sort((a, b) => a.y - b.y).forEach(d => d.f());
  events.forEach(ev => { if (ev.type === 'lavaggio') drawEventFront(c, ev); });
  B.drawParts(c, dt);
  if (!started){
    c.fillStyle = 'rgba(255,255,255,.92)'; const tw = Math.min(W * 0.7, 460);
    B.rr(c, W / 2 - tw / 2, H * 0.2, tw, 64, 30); c.fill();
    c.fillStyle = B.INK; c.font = '800 30px "Baloo 2",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('👆 Tocca la strada!', W / 2, H * 0.2 + 34 + Math.sin(t * 5) * 3);
  }
  requestAnimationFrame(frame);
}
function drawItem(c, it){
  const gy = laneGround(it.lane), s = laneH / 60;
  if (it.kind === 'cono'){ drawCone(c, it.x, gy + it.y, s * 0.9, it.rot); return; }
  if (it.kind === 'pozza'){
    if (it.hit) return;
    c.beginPath(); c.ellipse(it.x, gy - 6 * s, 50 * s, 11 * s, 0, 0, Math.PI * 2); c.fillStyle = '#5aa9e6'; c.fill();
    c.beginPath(); c.ellipse(it.x - 12 * s, gy - 9 * s, 16 * s, 3 * s, 0, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.6)'; c.fill();
    return;
  }
  if (it.hit) return;
  const bob = Math.sin(t * 4 + it.phase) * 6 * s;
  c.beginPath(); c.ellipse(it.x, gy - 4, 22 * s, 5 * s, 0, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.18)'; c.fill();
  c.fillStyle = '#000'; c.font = Math.round(46 * s) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(it.e, it.x, gy - 42 * s + bob);
}
requestAnimationFrame(frame);
setTimeout(() => B.say('Brummè! Tocca la strada!'), 600);
})();
</script>
<script src="../schermo-intero.js" data-after="soundBtn"></script>
</body>
</html>
