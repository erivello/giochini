<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- aperto dall'icona sulla schermata Home: a tutto schermo, senza barre del browser -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Eroe Ragno</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icone/icona-48.png">
<link rel="apple-touch-icon" href="../icone/icona-180.png">
<script src="../app.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#e0262f;--blue:#1f4fbf;--ink:#1a1d33;--card:rgba(255,255,255,.92);--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:0;color:var(--ink)}

#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pill{background:var(--card);border-radius:22px;padding:4px 16px 2px;font-size:28px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;line-height:1.2}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25)}}
#slots{font-size:30px;padding:2px 12px;gap:2px}
#slots span{transition:filter .3s,transform .3s}
#slots span.off{filter:grayscale(1) opacity(.3)}
#topRight{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px}
.round{pointer-events:auto;width:56px;height:56px;border-radius:50%;background:var(--card);font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;text-decoration:none}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.rot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:32px}
#rotL{left:calc(14px + env(safe-area-inset-left))}
#rotR{right:calc(14px + env(safe-area-inset-right))}
#hint{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border-radius:24px;padding:6px 22px;
  font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:opacity .4s}
#hint .hand{font-size:40px;display:inline-block;animation:press 1s infinite}
@keyframes press{0%,100%{transform:translateY(0)}50%{transform:translateY(8px) scale(.92)}}
#hint.off{opacity:0}
#bigMsg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(34px,8vw,72px);font-weight:800;color:#fff;
  text-shadow:0 4px 0 var(--red),0 -2px 0 var(--blue),3px 3px 0 var(--blue),-3px 3px 0 var(--blue);opacity:0;transition:opacity .25s,transform .25s;text-align:center;white-space:nowrap}
#bigMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#arrows .arrow{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#ffe14d;border:4px solid #fff;
  box-shadow:0 4px 10px rgba(0,0,0,.3);pointer-events:auto;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;animation:pulse 1s infinite}
#arrows .arrow i{font-style:normal;display:block;line-height:1}
#speedWrap{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(56vw,520px);background:var(--card);border-radius:22px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#speedTrack{position:relative;height:22px;border-radius:11px;background:#e3e7ee;overflow:visible}
#speedFill{position:absolute;left:0;top:0;bottom:0;border-radius:11px;background:linear-gradient(90deg,#2ecc71,#ffc83d,#e0262f);width:100%}
#speedTrain{position:absolute;top:50%;font-size:36px;transform:translate(-50%,-55%) scaleX(-1);transition:left .1s}
#tapHint{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:clamp(30px,7vw,52px);font-weight:800;color:#fff;
  text-shadow:0 4px 0 var(--red),3px 3px 0 var(--blue),-3px 3px 0 var(--blue);white-space:nowrap;animation:pulse .6s infinite}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#menu{background:linear-gradient(180deg,rgba(20,30,80,.3),rgba(20,30,80,0) 30%,rgba(20,30,80,0) 50%,rgba(20,30,80,.55));justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}
#menu h1{margin:0;font-size:clamp(42px,10vw,88px);line-height:1;color:#fff;
  text-shadow:0 5px 0 var(--red),4px 4px 0 var(--blue),-4px 4px 0 var(--blue),0 10px 18px rgba(0,0,0,.35)}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mode{width:clamp(130px,28vw,200px);border-radius:26px;border:5px solid #fff;padding:8px 8px 10px;font-size:clamp(17px,2.6vw,22px);font-weight:800;line-height:1.1;
  box-shadow:0 7px 0 rgba(0,0,0,.25),0 12px 22px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.mode:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mode .ic{font-size:clamp(44px,9vw,66px);line-height:1.1;text-shadow:none}
.mode small{font-size:15px;opacity:.95;min-height:18px}
.mode.m1{background:linear-gradient(180deg,#ff5a60,#c3141d)}
.mode.m2{background:linear-gradient(180deg,#4f86ff,#1f4fbf)}
.mode.m3{background:linear-gradient(180deg,#45d483,#1d9a55)}
#gamesLink{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left))}
@keyframes pulse{50%{transform:scale(1.07)}}
#pause,#trainEnd{background:rgba(20,30,80,.55)}
#trainEnd{background:transparent;justify-content:flex-end;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.row{display:flex;gap:20px}
.bigRound{width:110px;height:110px;border-radius:50%;font-size:52px;background:var(--card);box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.bigRound.go{background:#2ecc71}
.bigRound:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:#8fd3ff}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="tl">
    <div class="pill hidden" id="levelPill">Livello <span id="nLevel">1</span></div>
    <div class="pill hidden" id="slots"></div>
    <div class="pill hidden" id="balloonPill">🎈 <span id="nBalloons">0</span></div>
    <button class="round hidden" id="nightBtn" aria-label="Giorno o notte">🌙</button>
  </div>
  <div id="topRight">
    <button class="round" id="soundBtn" aria-label="Suono">🔊</button>
    <button class="round" id="pauseBtn" aria-label="Pausa">⏸️</button>
  </div>
  <div id="arrows"></div>
  <button class="round rot hidden" id="rotL" aria-label="Gira a sinistra">↩️</button>
  <button class="round rot hidden" id="rotR" aria-label="Gira a destra">↪️</button>
  <div id="hint" class="off"><span class="hand">👆</span> <span id="hintText"></span></div>
  <div id="speedWrap" class="hidden"><div id="speedTrack"><div id="speedFill"></div><div id="speedTrain">🚂</div></div></div>
  <div id="tapHint" class="hidden">👆 Tocca! Tocca!</div>
  <div id="bigMsg"></div>
</div>

<div id="menu" class="screen hidden">
  <a id="gamesLink" class="round" href="../index.html" aria-label="Tutti i giochi">🎮</a>
  <h1>Eroe Ragno</h1>
  <div class="modes">
    <button class="mode m1" data-mode="catch"><span class="ic">🦹</span>Acchiappa i cattivi<small id="rec1"></small></button>
    <button class="mode m2" data-mode="train"><span class="ic">🚂</span>Ferma il treno<small id="rec2"></small></button>
    <button class="mode m3" data-mode="free"><span class="ic">🏙️</span>Città libera<small id="rec3"></small></button>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="row">
    <button class="bigRound" id="toMenuBtn" aria-label="Menu">🏠</button>
    <button class="bigRound go" id="resumeBtn" aria-label="Continua">▶</button>
  </div>
</div>

<div id="trainEnd" class="screen hidden">
  <div class="row">
    <button class="bigRound" id="trainMenuBtn" aria-label="Menu">🏠</button>
    <button class="bigRound go" id="trainAgainBtn" aria-label="Ancora">🔁</button>
  </div>
</div>

<div id="loading">Carico la città… 🕸️</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('loading').textContent='Serve internet per giocare 🌐';return;}
document.getElementById('loading').remove();

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const PI=Math.PI,TAU=PI*2;
function lerpAngle(a,b,k){const d=((b-a+PI)%TAU+TAU)%TAU-PI;return a+d*k;}
const V3=THREE.Vector3;
const SAVE_KEY='eroe-ragno-v2';
let save={bestLevel:0,trainStops:0,balloons:0};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ================= renderer / scene ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,1,0.1,500);
scene.background=new THREE.Color(0x8fd3ff);
scene.fog=new THREE.Fog(0x8fd3ff,70,210);
const hemi=new THREE.HemisphereLight(0xffffff,0x7a8a99,0.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(-20,40,10);scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?75:62;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function emojiTex(e){return canvasTex(64,64,g=>{g.font='52px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,32,36);});}

/* ================= textures & shared materials ================= */
const webTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d8232a';g.fillRect(0,0,w,h);g.strokeStyle='#2a0608';g.lineWidth=2.5;
  for(let x=0;x<=w;x+=32){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
  for(let y=16;y<h;y+=30){g.beginPath();for(let x=0;x<=w;x+=32){g.moveTo(x,y);g.quadraticCurveTo(x+16,y+8,x+32,y);}g.stroke();}});
const winPattern=[];for(let i=0;i<16;i++)winPattern.push(Math.random()<0.6);
const winMap=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle='#b7c3cf';g.fillRect(i*64+12,j*64+10,40,46);g.fillStyle='#86b4d8';g.fillRect(i*64+15,j*64+13,34,40);
    g.fillStyle='rgba(255,255,255,.5)';g.fillRect(i*64+17,j*64+15,8,36);}});
const winEm=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){if(winPattern[i*4+j]){g.fillStyle='#ffd76a';g.fillRect(i*64+15,j*64+13,34,40);}}});
[winMap,winEm].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
const wallColors=[0xf2a65a,0x7fc8f8,0xf7d070,0xb5a1e8,0x8fd694,0xf28b9a,0xd9d4cc];
const wallBases=wallColors.map(c=>new THREE.MeshLambertMaterial({color:c,map:winMap,emissive:0x000000,emissiveMap:winEm}));
const roofBase=new THREE.MeshLambertMaterial({color:0x7b808c});
const asphaltMat=new THREE.MeshLambertMaterial({color:0x50565f});
const sidewalkMat=new THREE.MeshLambertMaterial({color:0xcfc9bd});
const parkMat=new THREE.MeshLambertMaterial({color:0x7cc46a});
const trunkMat=new THREE.MeshLambertMaterial({color:0x8a5a35});
const leafMat=new THREE.MeshLambertMaterial({color:0x3fa34d});
const tankMat=new THREE.MeshLambertMaterial({color:0x9b6b43});
const concreteMat=new THREE.MeshLambertMaterial({color:0xb9b4ac});
const metalMat=new THREE.MeshLambertMaterial({color:0x6d7480});
const dashTex=canvasTex(16,64,g=>{g.fillStyle='#ffd23f';g.fillRect(0,0,16,32);});dashTex.wrapT=THREE.RepeatWrapping;dashTex.repeat.set(1,48);
const dashMat=new THREE.MeshBasicMaterial({map:dashTex,transparent:true,depthWrite:false});
const roadTex=canvasTex(512,128,(g,w,h)=>{const u=w/40;g.fillStyle='#8c949c';g.fillRect(0,0,w,h);
  g.fillStyle='#d6d0c4';g.fillRect(w/2-11*u,0,22*u,h);
  g.fillStyle='#4a4f57';g.fillRect(w/2-6*u,0,12*u,h);
  g.fillStyle='#ffd23f';g.fillRect(w/2-0.2*u,0,0.4*u,h/2);
  g.fillStyle='#fff';g.fillRect(w/2-5.6*u,0,0.25*u,h);g.fillRect(w/2+5.35*u,0,0.25*u,h);});
roadTex.wrapT=THREE.RepeatWrapping;roadTex.repeat.set(1,40);
const roadMat=new THREE.MeshLambertMaterial({map:roadTex});
const farMat=new THREE.MeshLambertMaterial({color:0x7a8290});

/* shared geometries */
const G_=(()=>{const g={};
  g.tank=new THREE.CylinderGeometry(1.1,1.1,2.4,12);
  g.trunk=new THREE.CylinderGeometry(0.3,0.4,2.2,8);g.leaf=new THREE.SphereGeometry(2,12,10);
  g.hit=new THREE.SphereGeometry(3,8,6);g.hitSmall=new THREE.SphereGeometry(2.4,8,6);
  g.cocoon=new THREE.SphereGeometry(1,10,8);
  // robot
  g.rHead=new THREE.BoxGeometry(1.2,1,1);g.rEye=new THREE.CircleGeometry(0.26,16);g.rPup=new THREE.CircleGeometry(0.1,12);
  g.rAnt=new THREE.CylinderGeometry(0.03,0.03,0.4,6);g.rBall=new THREE.SphereGeometry(0.1,8,6);
  g.rArm=new THREE.CylinderGeometry(0.06,0.06,0.5,6);g.rProp=new THREE.BoxGeometry(0.06,0.04,0.7);
  // thief
  g.tLeg=new THREE.BoxGeometry(0.28,0.8,0.3);g.tBody=new THREE.BoxGeometry(0.9,0.95,0.55);g.tArm=new THREE.BoxGeometry(0.22,0.75,0.22);
  g.tHead=new THREE.SphereGeometry(0.36,16,12);g.tMask=new THREE.CylinderGeometry(0.378,0.378,0.17,18,1,true);
  g.tEye=new THREE.SphereGeometry(0.07,8,6);g.tHat=new THREE.SphereGeometry(0.385,16,8,0,TAU,0,PI/2);g.tSack=new THREE.SphereGeometry(0.5,12,10);
  // balloon
  g.bBall=new THREE.SphereGeometry(1,16,12);g.bKnot=new THREE.ConeGeometry(0.18,0.3,8);g.bString=new THREE.CylinderGeometry(0.02,0.02,2.6,4);
  // web
  g.web=new THREE.CylinderGeometry(0.04,0.04,1,6);
  return g;})();
const hitMat=new THREE.MeshBasicMaterial({visible:false});
const webMat=new THREE.MeshBasicMaterial({color:0xffffff});
const cocoonMat=new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true});

/* ================= the hero ================= */
const hero=(function(){
  const g=new THREE.Group();
  const red=new THREE.MeshLambertMaterial({map:webTex});
  const blue=new THREE.MeshLambertMaterial({color:0x1f4fbf});
  const black=new THREE.MeshLambertMaterial({color:0x111111});
  const white=new THREE.MeshBasicMaterial({color:0xffffff});
  const body=new THREE.Group();body.position.y=0.95;g.add(body);
  const torso=new THREE.Mesh(new THREE.SphereGeometry(0.5,20,16),red);torso.scale.set(0.78,1,0.58);torso.position.y=0.42;body.add(torso);
  const hips=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,12),blue);hips.scale.set(0.66,0.42,0.5);hips.position.y=0.08;body.add(hips);
  const emb=new THREE.Group();emb.position.set(0,0.55,0.285);body.add(emb);
  const eb=new THREE.Mesh(new THREE.SphereGeometry(0.06,10,8),black);eb.scale.set(0.8,1.5,0.5);emb.add(eb);
  for(let i=0;i<8;i++){const s=i<4?1:-1,k=i%4;const leg=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.018,0.018),black);
    leg.position.set(s*0.09,0.05-k*0.035,0);leg.rotation.z=s*(0.6-k*0.4);emb.add(leg);}
  const head=new THREE.Group();head.position.y=1.12;body.add(head);
  head.add(new THREE.Mesh(new THREE.SphereGeometry(0.31,24,18),red));
  for(const s of [-1,1]){
    const rim=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,12),black);rim.scale.set(1,0.72,0.3);
    rim.position.set(s*0.12,0.04,0.27);rim.rotation.set(-0.15,s*0.35,s*0.55);head.add(rim);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,12),white);eye.scale.set(1,0.66,0.3);
    eye.position.set(s*0.123,0.042,0.29);eye.rotation.copy(rim.rotation);head.add(eye);}
  function arm(sx){const a=new THREE.Group();a.position.set(sx*0.4,0.78,0);body.add(a);
    const up=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.085,0.66,10),red);up.position.y=-0.33;a.add(up);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.11,12,10),red);hand.position.y=-0.7;a.add(hand);
    a.userData.hand=hand;return a;}
  const armL=arm(1),armR=arm(-1);
  function leg(sx){const l=new THREE.Group();l.position.set(sx*0.17,0,0);body.add(l);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.1,0.82,10),blue);m.position.y=-0.41;l.add(m);
    const boot=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,10),red);boot.scale.set(1,0.75,1.4);boot.position.set(0,-0.86,0.05);l.add(boot);
    return l;}
  const legL=leg(1),legR=leg(-1);
  const sh=new THREE.Mesh(new THREE.CircleGeometry(0.7,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.25,depthWrite:false}));
  sh.rotation.x=-PI/2;scene.add(sh);
  scene.add(g);
  return {g,body,head,armL,armR,legL,legR,shadow:sh};
})();
let poseT=0;
function poseHero(dt,pose){const h=hero;poseT+=dt;const t=poseT;
  const L=(o,k,v)=>{o[k]+=(v-o[k])*Math.min(1,dt*10);};
  const aL=h.armL.rotation,aR=h.armR.rotation,lL=h.legL.rotation,lR=h.legR.rotation,b=h.body.rotation;
  let by=0.95,hx=0;
  if(pose==='run'){const s=Math.sin(t*12);L(b,'x',0.25);L(aL,'x',s*0.9);L(aR,'x',-s*0.9);L(aL,'z',0.15);L(aR,'z',-0.15);L(lL,'x',-s*0.8);L(lR,'x',s*0.8);by=0.95+Math.abs(Math.cos(t*12))*0.08;}
  else if(pose==='swing'){L(b,'x',0.35);L(aR,'x',-2.8);L(aR,'z',-0.3);L(aL,'x',0.5);L(aL,'z',0.6);L(lL,'x',-0.9);L(lR,'x',0.2);hx=-0.3;}
  else if(pose==='fly'){L(b,'x',0.5);L(aL,'x',-0.6);L(aR,'x',-0.6);L(aL,'z',1.3);L(aR,'z',-1.3);L(lL,'x',0.3+Math.sin(t*6)*0.15);L(lR,'x',0.3-Math.sin(t*6)*0.15);hx=-0.3;}

    if(celebrateT>0)celebrateT-=dt;
    if(mode==='menu'){menuT+=dt;const a=menuT*0.15;
      camera.position.set(H.pos.x+Math.sin(a)*10,H.pos.y+4,H.pos.z+Math.cos(a)*10);camera.lookAt(H.pos.x,H.pos.y+1.1,H.pos.z);
      hero.g.position.copy(H.pos);hero.g.rotation.set(0,Math.atan2(camera.position.x-H.pos.x,camera.position.z-H.pos.z),0);
      hero.shadow.position.set(H.pos.x,0.05,H.pos.z);hero.shadow.scale.setScalar(1);poseHero(dt,'wave');webLine.visible=false;updateFade(dt);}
    else if(mode==='catch'||mode==='free'){updateHero(dt);updateCityCamera(dt);updateFade(dt);
      for(const t of targets){if(t.kind==='balloon')updateBalloon(t,dt);else updateVillain(t,dt);}
      if(mode==='free')targets=targets.filter(t=>!t.gone);}
    else if(mode==='train')updateTrain(dt);
    updateFireworks(dt);updateParts(dt);}
  applyLight(paused?0:dt);updateArrows();
  renderer.render(scene,camera);}

showMenu();tick();
})();
</script>
<script src="../schermo-intero.js" data-after="soundBtn"></script>
</body>
